<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="SIMARC — Arsip">
  <defs>
    <!-- Brand blue background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Glass highlight -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Sheet of paper -->
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE8FF"/>
    </linearGradient>

    <!-- Archive box body -->
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7EEFF"/>
    </linearGradient>

    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0A1E46" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded squircle background -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#bg)"/>
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#glass)"/>
  <rect x="11.5" y="11.5" width="177" height="177" rx="38.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Documents peeking out of the box -->
  <g filter="url(#ds)">
    <rect x="70" y="42" width="60" height="46" rx="6" fill="#B9CFFB" transform="rotate(-6 100 65)"/>
    <rect x="66" y="48" width="68" height="44" rx="6" fill="url(#paper)" stroke="#C2D5FA" stroke-width="1.5" transform="rotate(5 100 70)"/>
  </g>
  <g stroke="#A9C3F7" stroke-width="3" stroke-linecap="round" opacity="0.95" transform="rotate(5 100 70)">
    <line x1="76" y1="60" x2="124" y2="60"/>
    <line x1="76" y1="69" x2="126" y2="69"/>
  </g>

  <!-- Archive box -->
  <g filter="url(#ds)">
    <rect x="36" y="72" width="128" height="24" rx="9" fill="url(#box)"/>
    <rect x="46" y="100" width="108" height="56" rx="12" fill="url(#box)"/>
  </g>
  <line x1="44" y1="98" x2="156" y2="98" stroke="#1E40AF" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Handle slot -->
  <rect x="80" y="114" width="40" height="14" rx="7" fill="#1E40AF"/>
  <rect x="80" y="114" width="40" height="14" rx="7" fill="none" stroke="#93B4F7" stroke-width="1.2" opacity="0.5"/>
</svg>
