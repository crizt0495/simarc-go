{{define "pemberkasan/create.html"}}{{template "layouts/app.html" .}}{{end}}
{{define "content"}}
<style>
.create-wrap { max-width: 800px; margin: 0 auto; }
.create-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--sh); overflow: hidden; animation: slideUp 0.35s ease both; }
.create-header { background: linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 50%, var(--ink-2) 100%); padding: 1.75rem 2rem; position: relative; overflow: hidden; }
.create-header::after { content: ''; position: absolute; top: -50%; right: -10%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
.create-header h4 { font-weight: 800; color: var(--ink); margin-bottom: 0.2rem; position: relative; z-index: 1; }
.create-header p { color: rgba(255,255,255,0.75); font-weight: 500; font-size: 0.85rem; margin-bottom: 0; position: relative; z-index: 1; }
.create-body { padding: 2rem; }
.form-field { margin-bottom: 1.25rem; }
.form-field label { display: block; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); margin-bottom: 0.4rem; }
.form-field label .req { color: var(--ink-2); margin-left: 2px; }
.form-field .form-control, .form-field .form-select { width: 100%; padding: 0.6rem 0.85rem; border: 1.5px solid var(--border); border-radius: var(--r); font-size: 0.85rem; color: var(--ink); background: var(--surface); transition: all 0.18s ease; outline: none; font-family: inherit; }
.form-field .form-control:focus, .form-field .form-select:focus { border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
.form-field textarea.form-control { min-height: 90px; resize: vertical; }
.form-field .form-text { font-size: 0.72rem; color: var(--ink-4); margin-top: 0.2rem; }
@media (max-width: 768px) { .create-header { padding: 1.25rem; } .create-body { padding: 1.25rem; } }
</style>
<div class="container-fluid py-3 py-xl-4">
    <div class="create-wrap">
        <div class="create-card shadow-sm">
            <div class="create-header">
                <h4><i class="bi bi-folder-plus me-2"></i>Tambah Pemberkasan</h4>
                <p>Buat pemberkasan baru untuk mengelompokkan arsip</p>
            </div>
            <div class="create-body">
                <form method="POST" action="/pemberkasan">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-field">
                                <label>Kode Berkas <span class="req">*</span></label>
                                <input type="text" class="form-control" name="kode_berkas" value="{{.OldKodeBerkas}}" required placeholder="Contoh: BERKAS-2026/001">
                                <div class="form-text">Kode unik untuk pemberkasan ini</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-field">
                                <label>Nama Berkas</label>
                                <input type="text" class="form-control" name="nama_pemberkasan" value="{{.OldNamaPemberkasan}}" placeholder="Nama deskriptif pemberkasan">
                            </div>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="form-field">
                                <label>Tahun <span class="req">*</span></label>
                                <input type="number" class="form-control" name="tahun" value="{{.OldTahun}}" min="1900" required placeholder="2026">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-field">
                                <label>Tanggal Mulai <span class="req">*</span></label>
                                <input type="date" class="form-control" name="tanggal_mulai" value="{{.OldTanggalMulai}}" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-field">
                                <label>Tanggal Tutup</label>
                                <input type="date" class="form-control" name="tanggal_tutup" value="{{.OldTanggalTutup}}">
                                <div class="form-text">Kosongkan jika belum ditutup</div>
                            </div>
                        </div>
                    </div>
                    <hr style="border-color:var(--border);margin:1.5rem 0;">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <a href="/pemberkasan" class="btn btn-secondary rounded-pill fw-700 px-4 btn-sm"><i class="bi bi-arrow-left me-1"></i>Batal</a>
                        <button type="submit" class="btn btn-primary rounded-pill fw-800 px-5 py-2 shadow-sm"><i class="bi bi-save me-2"></i>Simpan Pemberkasan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
