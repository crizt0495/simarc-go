{{define "mobile/create.html"}}<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF4D00">
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <title>Tambah Arsip - {{.AppName}}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
:root{--nb-bg:#F7F3EB;--nb-bg-alt:#EFE8D9;--nb-surface:#FFFDF7;--nb-surface-2:#F5EEDD;--nb-surface-3:#E7DDC9;--nb-ink:#14110B;--nb-ink-2:#2A261D;--nb-ink-3:#524C3E;--nb-ink-4:#5F5849;--nb-border:#14110B;--nb-border-light:#2A261D;--nb-primary:#FF4D00;--nb-primary-dark:#B93300;--nb-primary-light:#FFE4D6;--nb-danger:#D7263D;--nb-danger-dark:#B31E31;--nb-danger-light:#FBE3E7;--nb-success:#007A4F;--nb-success-dark:#006B43;--nb-success-light:#DDF5EA;--nb-warning:#FFD11A;--nb-warning-dark:#8F6400;--nb-warning-light:#FFF6CC;--nb-info:#0B7285;--nb-info-dark:#0A5F6E;--nb-info-light:#DDF2F5;--nb-purple:#7C3AED;--nb-indigo:#4F4AD8;--nb-orange:#FF7A00;--nb-pink:#F472B6;--nb-lime:#84CC16;--nb-shadow-sm:3px 3px 0 0 #14110B;--nb-shadow:5px 5px 0 0 #14110B;--nb-shadow-lg:7px 7px 0 0 #14110B;--nb-gap:1.25rem;--nb-on-primary:#14110B;--nb-on-primary-hover:#FFFFFF;--nb-on-success:#FFFFFF;--nb-on-danger:#FFFFFF;--nb-on-warning:#14110B;--nb-on-info:#FFFFFF;--nb-on-dark:#FFFFFF;--nb-on-accent:#FFFFFF;--ink:var(--nb-ink);--ink-2:var(--nb-ink-2);--ink-3:var(--nb-ink-3);--ink-4:var(--nb-ink-4);--surface:var(--nb-surface);--surface-2:var(--nb-surface-2);--surface-3:var(--nb-surface-3);--bg-alt:var(--nb-bg-alt);--border:var(--nb-border);--border-light:var(--nb-border-light);--neu-bg:var(--nb-bg);--primary:var(--nb-primary);--primary-dark:var(--nb-primary-dark);--primary-light:var(--nb-primary-light);--base:var(--nb-surface)}

        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--surface-3);padding:1rem;padding-bottom:70px}
        .card{background:white;border-radius:16px;padding:1.5rem;margin-bottom:1rem;box-shadow: 3px 3px 0 0 #14110B}
        .card-header{font-size:1.25rem;font-weight:700;color:var(--ink-2);margin-bottom:1rem}
        .form-group{margin-bottom:1rem}
        .form-label{display:block;font-weight:600;color:var(--ink-2);margin-bottom:0.5rem}
        .form-control{width:100%;padding:0.75rem;border:1px solid var(--nb-surface-3);border-radius:12px;font-size:1rem}
        .form-control:focus{outline:none;border-color:var(--ink-2)}
        .btn{width:100%;padding:1rem;border:none;border-radius:12px;font-size:1rem;font-weight:600;text-align:center;text-decoration:none;margin-bottom:0.5rem;cursor:pointer;display:inline-block}
        .btn-primary{background:linear-gradient(135deg,var(--ink-2),var(--ink-2));color:white}
        .btn-secondary{background:var(--surface-3);color:var(--ink-2)}
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header"><i class="bi bi-plus-circle me-2"></i>Tambah Arsip Baru</div>
        <form action="/mobile/store" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label">Nama Arsip *</label>
                <input type="text" name="nama_arsip" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Jenis Arsip *</label>
                <select name="jenis_arsip" class="form-control form-select" required>
                    <option value="">Pilih Jenis</option>
                    <option value="SPJ">SPJ</option>
                    <option value="Kontrak">Kontrak</option>
                    <option value="SK">SK</option>
                    <option value="Nota Dinas">Nota Dinas</option>
                    <option value="Surat Dinas">Surat Dinas</option>
                    <option value="Laporan">Laporan</option>
                    <option value="Invoice">Invoice</option>
                    <option value="Faktur">Faktur</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Status *</label>
                <select name="status_arsip" class="form-control form-select" required>
                    <option value="aktif">Aktif</option>
                    <option value="inaktif">Inaktif</option>
                    <option value="siap_penyusutan">Siap Penyusutan</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Tanggal Dibuat *</label>
                <input type="date" name="tanggal_dibuat" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Uraian Lengkap</label>
                <textarea name="uraian_lengkap" class="form-control" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Lokasi Arsip *</label>
                <select name="lokasi_arsip_id" class="form-control form-select" required>
                    <option value="">Pilih Lokasi</option>
                    {{range .LokasiArsip}}
                    <option value="{{.ID}}">{{.NamaLokasi}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">File (Optional)</label>
                <input type="file" name="file" class="form-control" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                <small style="color:var(--nb-ink-4)">Max 10MB (PDF, DOC, JPG, PNG)</small>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Simpan Arsip</button>
            <a href="javascript:history.back()" class="btn btn-secondary"><i class="bi bi-x-circle me-2"></i>Batal</a>
        </form>
    </div>
</body>
</html>{{end}}
