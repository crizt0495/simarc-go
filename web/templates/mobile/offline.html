{{define "mobile/offline.html"}}<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — {{.AppName}}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--brand:#6C5CE7;--brand-dk:#5A4BD4;--ink:#262626;--ink-2:#3A3A3A;--ink-3:#5C6470;--ink-4:#9099A6;--surface:#FAF6EF;--surface-2:#FFFFFF;--surface-3:#F0EADF;--border:#262626;--border-2:#3A3A3A;--warning:#D89B21;--r-sm:6px;--r:10px;--shadow-dark:rgba(38,38,38,.22)}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
    .card{background:var(--surface-2);border:2px solid var(--border);border-radius:var(--r);box-shadow:8px 8px 0 var(--shadow-dark);padding:40px 32px;max-width:400px;width:100%;text-align:center}
    .icon{width:68px;height:68px;border-radius:var(--r-sm);background:var(--warning);border:2px solid var(--border);box-shadow:4px 4px 0 var(--shadow-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;color:var(--ink)}
    h1{font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em;color:var(--ink)}
    p{font-size:14px;color:var(--ink-3);line-height:1.6;margin-bottom:28px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:var(--r-sm);background:var(--brand);border:2px solid var(--border);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none;transition:all .12s ease;box-shadow:4px 4px 0 var(--shadow-dark);width:100%}
    .btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow-dark);background:var(--brand-dk)}
    .btn:active{transform:translate(3px,3px);box-shadow:none}
    .footer{font-size:11px;color:var(--ink-4);margin-top:28px;padding-top:20px;border-top:2px solid var(--border-2)}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
    <h1>Tidak Ada Koneksi</h1>
    <p>Anda sedang offline. Silakan periksa koneksi internet Anda dan coba lagi.</p>
    <a href="javascript:location.reload()" class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Coba Lagi</a>
    <div class="footer">&copy; {{.Year}} {{.AppName}}</div>
  </div>
</body>
</html>
{{end}}
