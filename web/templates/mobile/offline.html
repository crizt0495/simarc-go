{{define "mobile/offline.html"}}<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — {{.AppName}}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--brand:#4F46E5;--brand-dk:#4338CA;--ink:#0F172A;--ink-2:#1E293B;--ink-3:#475569;--ink-4:#94A3B8;--surface:#F8FAFC;--surface-2:#FFFFFF;--surface-3:#F1F5F9;--border:#E2E8F0;--border-2:#CBD5E1;--warning:#D97706;--warning-lt:rgba(217,119,6,.12);--r-sm:10px;--r:16px;--sh-lg:0 10px 15px -3px rgba(15,23,42,.1);--sh-sm:0 1px 3px rgba(15,23,42,.08)}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
    .card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-lg);padding:40px 32px;max-width:400px;width:100%;text-align:center}
    .icon{width:64px;height:64px;border-radius:50%;background:var(--warning-lt);color:var(--warning);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px}
    h1{font-size:22px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em;color:var(--ink)}
    p{font-size:14px;color:var(--ink-3);line-height:1.6;margin-bottom:28px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:10px;background:var(--brand);border:none;color:#fff;font-weight:600;font-size:14px;text-decoration:none;transition:all .12s ease;box-shadow:var(--sh-sm);width:100%}
    .btn:hover{background:var(--brand-dk);box-shadow:var(--sh-lg)}
    .btn:active{transform:scale(.98)}
    .footer{font-size:11px;color:var(--ink-4);margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
    <h1>Tidak Ada Koneksi</h1>
    <p>Anda sedang offline. Silakan periksa koneksi internet Anda dan coba lagi.</p>
    <a href="javascript:location.reload()" class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Coba Lagi</a>
    <div class="footer">&copy; {{.Year}} {{.AppName}}</div>
  </div>
</body>
</html>
{{end}}
