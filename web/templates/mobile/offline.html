{{define "mobile/offline.html"}}<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — {{.AppName}}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--neu-bg);color:var(--ink-2);display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
    .card{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,0.06);padding:48px 40px;max-width:400px;width:100%;text-align:center}
    .icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--ink-2),var(--ink-2));display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;color:#fff;box-shadow:0 8px 24px rgba(245,158,11,0.25)}
    h1{font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-0.03em}
    p{font-size:14px;color:#64748b;line-height:1.6;margin-bottom:28px}
    .btn{display:inline-block;padding:12px 24px;border-radius:12px;background:linear-gradient(135deg,var(--ink-2),var(--ink-2));color:#fff;font-weight:700;font-size:14px;text-decoration:none;transition:all 0.2s ease;box-shadow:0 4px 16px rgba(59,130,246,0.25)}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,130,246,0.35)}
    .footer{font-size:11px;color:#94a3b8;margin-top:28px;padding-top:20px;border-top:1px solid #e2e8f0}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
    <h1>Tidak Ada Koneksi</h1>
    <p>Anda sedang offline. Silakan periksa koneksi internet Anda dan coba lagi.</p>
    <a href="javascript:location.reload()" class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Coba Lagi</a>
    <div class="footer">&copy; {{.Year}} {{.AppName}}</div>
  </div>
</body>
</html>
{{end}}
