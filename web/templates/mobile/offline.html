{{define "mobile/offline.html"}}<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — {{.AppName}}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--accent:#4f46e5;--accent-strong:#4338ca;--ink:#1e293b;--ink-2:#334155;--ink-3:#64748b;--ink-4:#94a3b8;--surface:#fff;--surface-2:#f8fafc;--surface-3:#f1f5f9;--border:#e2e8f0;--radius-lg:20px;--radius-md:10px;--shadow-sm:0 1px 3px rgba(15,23,42,.06);--shadow-lg:0 20px 25px -5px rgba(15,23,42,.1)}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--surface-2);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:40px 32px;max-width:400px;width:100%;text-align:center}
    .icon{width:64px;height:64px;border-radius:var(--radius-lg);background:var(--c-warning-soft,rgba(217,119,6,.12));display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;color:#d97706;box-shadow:0 8px 20px -4px rgba(217,119,6,.25)}
    h1{font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-.03em;color:var(--ink)}
    p{font-size:14px;color:var(--ink-3);line-height:1.6;margin-bottom:28px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--radius-md);background:var(--accent);border:none;color:#fff;font-weight:700;font-size:14px;text-decoration:none;transition:all .2s ease;box-shadow:0 1px 2px rgba(79,70,229,.4);width:100%}
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -4px rgba(79,70,229,.4)}
    .footer{font-size:11px;color:var(--ink-4);margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
    <h1>Tidak Ada Koneksi</h1>
    <p>Anda sedang offline. Silakan periksa koneksi internet Anda dan coba lagi.</p>
    <a href="javascript:location.reload()" class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Coba Lagi</a>
    <div class="footer">&copy; {{.Year}} {{.AppName}}</div>
  </div>
</body>
</html>
{{end}}
