{{define "unit-kerja/show.html"}}{{template "layouts/app.html" .}}{{end}}
{{define "content"}}
<div class="row">
    <div class="col-md-12">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h2><i class="bi bi-building me-2"></i>Detail Unit Kerja</h2>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Nama Unit</label>
                    <p class="form-control-plaintext">{{.Item.NamaUnit}}</p>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Dibuat Tanggal</label>
                    <p class="form-control-plaintext">{{.Item.CreatedAt}}</p>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Diperbarui Tanggal</label>
                    <p class="form-control-plaintext">{{.Item.UpdatedAt}}</p>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/unit-kerja" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-1"></i> <span class="d-none d-sm-inline">Kembali</span>
                    </a>
                    <div class="btn-group">
                        <a href="/unit-kerja/{{.Item.ID}}/edit" class="btn btn-warning" title="Edit">
                            <i class="bi bi-pencil me-1"></i> Edit
                        </a>
                        <form action="/unit-kerja/{{.Item.ID}}/delete" method="POST" class="d-inline" onsubmit="return confirm('Apakah Anda yakin ingin menghapus unit kerja ini?')">
                            <button type="submit" class="btn btn-danger" title="Hapus">
                                <i class="bi bi-trash3 me-1"></i> Hapus
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
