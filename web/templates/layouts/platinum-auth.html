{{define "layouts/platinum-auth.html"}}
<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="csrf-token" content="{{.CSRFToken}}">
  <title>{{.title}} — {{.AppName}}</title>

  <link rel="icon" type="image/svg+xml" href="/images/logo-icon.svg?v={{.AssetVersion}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://code.jquery.com">

  <!-- Critical CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" fetchpriority="high">

  <!-- Non-critical: load icons async -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
  <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"></noscript>
  <link href="/css/enterprise-premium.css?v={{.AssetVersion}}" rel="stylesheet">
  <link href="/css/dark-mode.css?v={{.AssetVersion}}" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body.auth-body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: safe center;
      justify-content: center;
      position: relative;
      background: var(--surface);
      overflow-x: hidden;
      padding: 20px;
    }

    /* ── Brutalist animated background ── */
    .auth-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .auth-bg-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(600px 420px at 12% 10%, rgba(108,92,231,.12) 0%, transparent 60%),
        radial-gradient(520px 380px at 92% 92%, rgba(77,150,255,.10) 0%, transparent 55%),
        radial-gradient(420px 320px at 50% 100%, rgba(43,163,131,.08) 0%, transparent 50%);
    }
    .auth-bg-grid {
      position: absolute;
      inset: 0;
      background: radial-gradient(700px 500px at 50% 30%, rgba(108,92,231,.05) 0%, transparent 70%);
    }

    /* Floating orbs */
    .auth-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      border: 2px solid rgba(38,38,38,.08);
      filter: none;
    }
    .auth-orb-1 {
      width: 300px; height: 300px;
      background: rgba(108,92,231,.10);
      top: -110px; left: -90px;
      animation: orbDrift 22s ease-in-out infinite;
    }
    .auth-orb-2 {
      width: 260px; height: 260px;
      background: rgba(77,150,255,.10);
      bottom: -100px; right: -80px;
      animation: orbDrift 18s ease-in-out infinite reverse;
    }
    .auth-orb-3 {
      width: 180px; height: 180px;
      background: rgba(159,122,234,.10);
      top: 52%; left: 62%;
      animation: orbDrift 15s ease-in-out infinite 4s;
    }
    @keyframes orbDrift {
      0%, 100% { transform: translate(0,0); }
      33% { transform: translate(26px,-32px); }
      66% { transform: translate(-18px,20px); }
    }

    /* ── Login card ── */
    .auth-card-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      animation: cardIn 0.45s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-card {
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: var(--r);
      padding: 40px 36px 32px;
      box-shadow: 8px 8px 0 var(--neu-shadow-dark);
    }

    /* ── Logo & header ── */
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header .auth-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      background: var(--brand);
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      box-shadow: 4px 4px 0 var(--neu-shadow-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      font-size: 28px;
    }
    .auth-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }
    .auth-header p {
      font-size: 13px;
      color: var(--ink-4);
      margin: 0;
    }

    /* ── Alerts ── */
    .auth-alert {
      padding: 12px 16px;
      border-radius: var(--r);
      border: 2px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
      font-weight: 700;
      animation: alertPop 0.35s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes alertPop {
      from { opacity: 0; transform: scale(.95) translateY(-6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes authShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .animate-shake { animation: authShake 0.4s ease; }
    .auth-alert-success { background: var(--green-lt); color: var(--green-dk); box-shadow: 3px 3px 0 var(--green); }
    .auth-alert-danger { background: var(--maroon-lt); color: var(--maroon-dk); box-shadow: 3px 3px 0 var(--maroon); }

    /* ── Form ── */
    .auth-field { margin-bottom: 18px; }
    .auth-field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-2);
      margin-bottom: 6px;
    }

    .auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--neu-bg);
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      box-shadow: var(--neu-inset);
      transition: all .15s ease;
    }
    .auth-input-wrap:focus-within {
      border-color: var(--brand);
      box-shadow: var(--neu-inset), 0 0 0 2px var(--brand-lt);
    }

    .auth-field-icon {
      position: absolute;
      left: 14px;
      color: var(--ink-4);
      font-size: 16px;
      pointer-events: none;
      transition: color .2s;
    }
    .auth-input-wrap:focus-within .auth-field-icon { color: var(--brand); }

    .auth-input {
      width: 100%;
      height: 50px;
      padding: 0 44px 0 42px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      font-weight: 600;
    }
    .auth-input::placeholder { color: var(--ink-4); font-weight: 400; }

    .auth-pw-toggle {
      position: absolute;
      right: 8px;
      width: 34px;
      height: 34px;
      border: 2px solid transparent;
      background: transparent;
      color: var(--ink-4);
      font-size: 16px;
      cursor: pointer;
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }
    .auth-pw-toggle:hover { background: var(--surface-3); color: var(--ink); }

    /* ── Login button ── */
    .auth-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 50px;
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--brand);
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      font-family: inherit;
      box-shadow: 4px 4px 0 var(--neu-shadow-dark);
      cursor: pointer;
      transition: all .12s ease;
      margin-top: 6px;
      overflow: hidden;
    }
    .auth-btn:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--neu-shadow-dark); background: var(--brand-dk); }
    .auth-btn:active { transform: translate(3px,3px); box-shadow: none; }
    .auth-btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

    .auth-btn .spinner {
      display: none;
      width: 17px; height: 17px;
      border: 3px solid var(--ink);
      border-top-color: transparent;
      border-radius: 50%;
      animation: authSpin 0.6s linear infinite;
    }
    .auth-btn.loading .spinner { display: inline-block; }
    .auth-btn.loading .btn-text,
    .auth-btn.loading .btn-icon { display: none; }
    @keyframes authSpin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 2px solid var(--border-2);
      font-size: 12px;
      color: var(--ink-4);
    }
    .auth-footer i { font-size: 10px; }

    /* ── Theme toggle ── */
    .auth-theme-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      border: 2px solid var(--border);
      box-shadow: 3px 3px 0 var(--neu-shadow-dark);
      color: var(--ink-3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s;
      font-size: 18px;
    }
    .auth-theme-btn:hover { color: var(--ink); box-shadow: 4px 4px 0 var(--neu-shadow-dark); transform: translate(-1px,-1px); }
    .auth-theme-btn:active { box-shadow: none; transform: translate(2px,2px); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      body.auth-body { padding: 12px; align-items: flex-start; padding-top: 40px; }
      .auth-card { padding: 28px 18px 24px; border-radius: var(--r-sm); box-shadow: 5px 5px 0 var(--neu-shadow-dark); }
      .auth-header { margin-bottom: 24px; }
      .auth-header h1 { font-size: 20px; }
      .auth-input { height: 48px; font-size: 16px; }
      .auth-btn { height: 48px; }
      .auth-header .auth-logo { width: 56px; height: 56px; font-size: 24px; }
      .auth-theme-btn { top: 14px; right: 14px; width: 40px; height: 40px; }
    }
  </style>
</head>
<body class="auth-body">
  <!-- ─── ANIMATED BACKGROUND ─── -->
  <div class="auth-bg">
    <div class="auth-bg-gradient"></div>
    <div class="auth-bg-grid"></div>
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
  </div>

  <!-- ─── LOGIN CARD ─── -->
  <div class="auth-card-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="bi bi-archive-fill"></i>
        </div>
        <h1>Selamat Datang</h1>
        <p>Masuk untuk mengakses sistem kearsipan elektronik</p>
      </div>

      {{block "content" .}}{{end}}

      <div class="auth-footer">
        &copy; {{.Year}}{{if .LANIP}} &middot; <i class="bi bi-wifi"></i> {{.LANIP}}{{end}}
      </div>
    </div>
  </div>

  <!-- ─── THEME TOGGLE ─── -->
  <button class="auth-theme-btn" id="authThemeBtn" title="Toggle tema">
    <i class="bi bi-moon" id="authThemeIcon"></i>
  </button>

  <script>
  (function() {
    var html = document.documentElement;
    var t = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', t);
    var icon = document.getElementById('authThemeIcon');
    if (icon) icon.className = t === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
    document.getElementById('authThemeBtn').addEventListener('click', function() {
      var nt = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nt);
      localStorage.setItem('theme', nt);
      icon.className = nt === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
    });
  })();
  </script>
</body>
</html>
{{end}}
