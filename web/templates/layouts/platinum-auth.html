{{define "layouts/platinum-auth.html"}}
<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{.CSRFToken}}">
  <title>{{.title}} — {{.AppName}}</title>

  <link rel="icon" type="image/svg+xml" href="/images/logo-icon.svg?v={{.AssetVersion}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://code.jquery.com">

  <!-- Critical CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" fetchpriority="high">

  <!-- Non-critical: load icons async -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
  <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"></noscript>
  <link href="/css/enterprise-premium.css?v={{.AssetVersion}}" rel="stylesheet">
  <link href="/css/dark-mode.css?v={{.AssetVersion}}" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body.auth-body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: safe center;
      justify-content: center;
      position: relative;
      background: var(--nb-bg);
      overflow-x: hidden;
      padding: 20px;
    }
    [data-theme="dark"] body.auth-body { background: #0E0E12; }

    .auth-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .auth-bg-gradient { display: none; }
    .auth-bg-grid {
      position: absolute;
      inset: 0;
      opacity: 0.15;
      background-image:
        linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    [data-theme="dark"] .auth-bg-grid {
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      opacity: 0.1;
    }
    .auth-orb { display: none; }

    .auth-card-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      animation: nbSlideUp 0.35s ease both;
    }

    .auth-card {
      background: var(--nb-surface) !important;
      border: 3px solid var(--nb-border) !important;
      border-radius: 0 !important;
      box-shadow: var(--nb-shadow-xl) !important;
      padding: 40px 32px 32px;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    [data-theme="dark"] .auth-card {
      background: #1A1A24 !important;
      border-color: #F0EDE4 !important;
      box-shadow: 8px 8px 0 0 #F0EDE4 !important;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: var(--nb-primary) !important;
      border: 3px solid var(--nb-border) !important;
      box-shadow: 4px 4px 0 0 var(--nb-ink) !important;
      border-radius: 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 30px;
      animation: none;
    }
    [data-theme="dark"] .auth-logo {
      background: #5B82FF !important;
      border-color: #F0EDE4 !important;
      color: #0E0E12 !important;
    }
    .auth-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--nb-ink);
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }
    [data-theme="dark"] .auth-header h1 { color: #F0EDE4; }
    .auth-header p {
      font-size: 14px;
      color: var(--nb-ink-4);
      margin: 0;
      font-weight: 600;
    }

    .auth-appname {
      text-align: center;
      margin-bottom: 28px;
      padding: 10px 16px;
      background: var(--nb-primary-light) !important;
      border: 2px solid var(--nb-border) !important;
      box-shadow: var(--nb-shadow-sm);
    }
    [data-theme="dark"] .auth-appname {
      background: #1A2240 !important;
      border-color: #F0EDE4 !important;
    }
    .auth-appname span {
      font-size: 12px;
      font-weight: 700;
      color: var(--nb-primary);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    [data-theme="dark"] .auth-appname span { color: #5B82FF; }

    .auth-alert {
      padding: 12px 16px;
      border: 2px solid var(--nb-border) !important;
      box-shadow: var(--nb-shadow-sm) !important;
      border-radius: 0 !important;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 18px;
      animation: nbSlideUp 0.3s ease both;
    }
    @keyframes authShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake { animation: authShake 0.4s ease; }
    .auth-alert-success {
      background: var(--nb-success-light) !important;
      color: var(--nb-success-dark) !important;
    }
    .auth-alert-danger {
      background: var(--nb-danger-light) !important;
      color: var(--nb-danger-dark) !important;
    }
    [data-theme="dark"] .auth-alert-success { background: #0A2820 !important; color: #00D9A4 !important; border-color: #F0EDE4 !important; }
    [data-theme="dark"] .auth-alert-danger { background: #2A1010 !important; color: #FF6666 !important; border-color: #F0EDE4 !important; }

    .auth-field { margin-bottom: 18px; }
    .auth-field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--nb-ink);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    [data-theme="dark"] .auth-field label { color: #F0EDE4; }

    .auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--nb-surface) !important;
      border: 2px solid var(--nb-border) !important;
      box-shadow: var(--nb-shadow-sm);
      transition: all 0.1s;
    }
    [data-theme="dark"] .auth-input-wrap { background: #22222C !important; border-color: #F0EDE4 !important; }
    .auth-input-wrap:focus-within {
      border-color: var(--nb-primary) !important;
      box-shadow: 4px 4px 0 0 var(--nb-primary) !important;
    }
    [data-theme="dark"] .auth-input-wrap:focus-within { box-shadow: 4px 4px 0 0 #5B82FF !important; border-color: #5B82FF !important; }

    .auth-field-icon {
      position: absolute;
      left: 16px;
      color: var(--nb-ink-4);
      font-size: 18px;
      pointer-events: none;
    }
    .auth-input-wrap:focus-within .auth-field-icon { color: var(--nb-primary); }

    .auth-input {
      width: 100%;
      height: 52px;
      padding: 0 16px 0 48px;
      border: none;
      background: transparent;
      font-size: 15px;
      font-family: inherit;
      font-weight: 600;
      color: var(--nb-ink);
      outline: none;
    }
    [data-theme="dark"] .auth-input { color: #F0EDE4; }
    .auth-input::placeholder { color: var(--nb-ink-4); font-weight: 500; }

    .auth-pw-toggle {
      position: absolute;
      right: 10px;
      width: 36px;
      height: 36px;
      border: 2px solid transparent !important;
      background: transparent;
      color: var(--nb-ink-4);
      font-size: 18px;
      cursor: pointer;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }
    .auth-pw-toggle:hover {
      background: var(--nb-surface-3);
      border-color: var(--nb-border) !important;
      color: var(--nb-ink);
    }

    .auth-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 52px;
      border: 3px solid var(--nb-border) !important;
      border-radius: 0 !important;
      background: var(--nb-primary) !important;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.08s;
      box-shadow: var(--nb-shadow) !important;
      margin-top: 8px;
      overflow: hidden;
    }
    .auth-btn::after { display: none; }
    .auth-btn:hover { transform: translate(-1px, -1px); box-shadow: var(--nb-shadow-lg) !important; }
    .auth-btn:active { transform: translate(2px, 2px); box-shadow: none !important; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .auth-btn .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: authSpin 0.6s linear infinite;
    }
    .auth-btn.loading .spinner { display: inline-block; }
    .auth-btn.loading .btn-text, .auth-btn.loading .btn-icon { display: none; }
    @keyframes authSpin { to { transform: rotate(360deg); } }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--nb-ink-4);
      font-weight: 600;
    }

    .auth-theme-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 0;
      background: var(--nb-surface) !important;
      border: 2px solid var(--nb-border) !important;
      box-shadow: var(--nb-shadow) !important;
      color: var(--nb-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.1s;
      font-size: 20px;
    }
    .auth-theme-btn:hover {
      background: var(--nb-primary) !important;
      color: #fff;
      transform: translate(-1px, -1px);
      box-shadow: var(--nb-shadow-lg) !important;
    }
    [data-theme="dark"] .auth-theme-btn {
      background: #1A1A24 !important;
      border-color: #F0EDE4 !important;
      color: #F0EDE4 !important;
      box-shadow: 4px 4px 0 0 #F0EDE4 !important;
    }
    [data-theme="dark"] .auth-theme-btn:hover {
      background: #5B82FF !important;
      color: #0E0E12 !important;
    }

    @media (max-width: 480px) {
      body.auth-body { padding: 12px; align-items: flex-start; padding-top: 48px; }
      .auth-card { padding: 28px 20px 24px; }
      .auth-header { margin-bottom: 24px; }
      .auth-header h1 { font-size: 20px; }
      .auth-input { height: 48px; font-size: 16px; }
      .auth-btn { height: 48px; }
      .auth-logo { width: 56px; height: 56px; font-size: 26px; }
      .auth-theme-btn { bottom: 16px; right: 16px; width: 40px; height: 40px; }
    }
</style>

  <!-- ═══════════════════════════════════════════
       NEO-BRUTALISM DESIGN OVERRIDE (minified)
       ═══════════════════════════════════════════ -->
  <link href="/css/neo-brutalism.min.css?v={{.AssetVersion}}" rel="stylesheet">
</head>
<body class="auth-body">
  <!-- ANIMATED BACKGROUND -->
  <div class="auth-bg">
    <div class="auth-bg-gradient"></div>
    <div class="auth-bg-grid"></div>
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
  </div>

  <!-- LOGIN CARD -->
  <div class="auth-card-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="bi bi-archive-fill"></i>
        </div>
        <h1>Selamat Datang</h1>
        <p>Masuk untuk mengakses sistem kearsipan elektronik</p>
      </div>

      {{block "content" .}}{{end}}

      <div class="auth-footer">
        &copy; {{.Year}}{{if .LANIP}} &middot; <i class="bi bi-wifi"></i> {{.LANIP}}{{end}}
      </div>
    </div>
  </div>

  <!-- THEME TOGGLE -->
  <button class="auth-theme-btn" id="authThemeBtn" title="Toggle tema">
    <i class="bi bi-moon" id="authThemeIcon"></i>
  </button>

  <script>
  (function() {
    var html = document.documentElement;
    var t = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', t);
    var icon = document.getElementById('authThemeIcon');
    if (icon) icon.className = t === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
    document.getElementById('authThemeBtn').addEventListener('click', function() {
      html.classList.add('transitioning');
      var nt = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nt);
      localStorage.setItem('theme', nt);
      icon.className = nt === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
      setTimeout(function(){ html.classList.remove('transitioning'); }, 320);
    });
  })();
  </script>
</body>
</html>
{{end}}
