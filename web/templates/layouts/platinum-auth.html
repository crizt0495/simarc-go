{{define "layouts/platinum-auth.html"}}
<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{.CSRFToken}}">
  <title>{{.title}} — {{.AppName}}</title>

  <link rel="icon" type="image/svg+xml" href="/images/logo-icon.svg?v={{.AssetVersion}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://code.jquery.com">

  <!-- Critical CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" fetchpriority="high">

  <!-- Non-critical: load icons async -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
  <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"></noscript>
  <link href="/css/enterprise-premium.css?v={{.AssetVersion}}" rel="stylesheet">
  <link href="/css/dark-mode.css?v={{.AssetVersion}}" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body.auth-body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: safe center;
      justify-content: center;
      position: relative;
      background: var(--surface-2, #f8fafc);
      overflow-x: hidden;
      padding: 20px;
    }
    [data-theme="dark"] body.auth-body { background: var(--surface-2); }

    /* ── Animated Background ── */
    .auth-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .auth-bg-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 45% at 10% 20%, rgba(79,70,229,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 80%, rgba(124,58,237,0.08) 0%, transparent 50%),
        radial-gradient(ellipse 40% 35% at 50% 50%, rgba(14,165,233,0.06) 0%, transparent 40%);
    }
    .auth-bg-grid {
      position: absolute;
      inset: 0;
      opacity: .5;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(700px 500px at 50% 40%, #000 0%, transparent 78%);
      mask-image: radial-gradient(700px 500px at 50% 40%, #000 0%, transparent 78%);
    }

    /* Floating orbs (soft, blurred) */
    .auth-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(70px);
    }
    .auth-orb-1 {
      width: 320px; height: 320px;
      background: rgba(79,70,229,.22);
      top: -120px; left: -100px;
      animation: orbDrift 25s ease-in-out infinite;
    }
    .auth-orb-2 {
      width: 260px; height: 260px;
      background: rgba(14,165,233,.16);
      bottom: -100px; right: -80px;
      animation: orbDrift 20s ease-in-out infinite reverse;
    }
    .auth-orb-3 {
      width: 180px; height: 180px;
      background: rgba(139,92,246,.14);
      top: 50%; left: 60%;
      animation: orbDrift 18s ease-in-out infinite 5s;
    }
    @keyframes orbDrift {
      0%, 100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(30px,-40px) scale(1.05); }
      66% { transform: translate(-20px,20px) scale(0.95); }
    }

    /* ── Login Card ── */
    .auth-card-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      animation: cardIn 0.5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-card {
      background: var(--surface, #fff);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-radius: var(--radius-2xl, 20px);
      padding: 40px 36px 32px;
      border: 1px solid var(--border, #e2e8f0);
      box-shadow: var(--shadow-xl, 0 20px 25px -5px rgba(15,23,42,.08));
    }
    [data-theme="dark"] .auth-card {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: var(--shadow-xl);
    }

    /* ── Logo & Header ── */
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      background: var(--gradient-primary, linear-gradient(135deg,#4f46e5,#4338ca));
      border: none;
      border-radius: var(--radius-xl, 16px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      box-shadow: 0 8px 20px -4px rgba(79,70,229,.35);
    }
    .auth-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }
    .auth-header p {
      font-size: 13px;
      color: var(--ink-4);
      margin: 0;
    }

    /* ── App Name Badge ── */
    .auth-appname {
      text-align: center;
      margin-bottom: 24px;
      padding: 8px 16px;
      background: var(--accent-soft, rgba(79,70,229,.06));
      border-radius: var(--radius-lg, 12px);
      border: 1px solid rgba(79,70,229,.12);
    }
    .auth-appname span {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-2);
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    /* ── Alerts ── */
    .auth-alert {
      padding: 12px 16px;
      border-radius: var(--radius-lg, 12px);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
      animation: alertPop 0.35s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes alertPop {
      from { opacity: 0; transform: scale(0.95) translateY(-6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes authShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .animate-shake { animation: authShake 0.4s ease; }
    .auth-alert-success {
      background: var(--c-success-soft, rgba(16,185,129,.1));
      color: var(--c-success);
      border: 1px solid rgba(16,185,129,.2);
    }
    .auth-alert-danger {
      background: var(--c-danger-soft, rgba(239,68,68,.1));
      color: var(--c-danger);
      border: 1px solid rgba(239,68,68,.2);
    }

    /* ── Form ── */
    .auth-field {
      margin-bottom: 18px;
    }
    .auth-field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
      margin-bottom: 6px;
    }

    .auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--surface-2, #f8fafc);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: var(--radius-lg, 12px);
      transition: all 0.15s ease;
      box-shadow: none;
    }
    .auth-input-wrap:focus-within {
      border-color: var(--accent, #4f46e5);
      box-shadow: 0 0 0 3px var(--accent-soft, rgba(79,70,229,.08));
      background: var(--surface, #fff);
    }

    .auth-field-icon {
      position: absolute;
      left: 14px;
      color: var(--ink-4);
      font-size: 16px;
      pointer-events: none;
      transition: color 0.2s;
    }
    .auth-input-wrap:focus-within .auth-field-icon { color: var(--accent); }

    .auth-input {
      width: 100%;
      height: 48px;
      padding: 0 44px 0 42px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      font-weight: 500;
    }
    .auth-input::placeholder { color: var(--ink-4); font-weight: 400; }

    .auth-pw-toggle {
      position: absolute;
      right: 8px;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--ink-4);
      font-size: 16px;
      cursor: pointer;
      border-radius: var(--radius-md, 8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .auth-pw-toggle:hover {
      background: var(--surface-3);
      color: var(--ink-2);
    }

    /* ── Login Button ── */
    .auth-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--radius-lg, 12px);
      background: var(--gradient-primary, linear-gradient(135deg,#4f46e5,#4338ca));
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(79,70,229,.4);
      margin-top: 6px;
      overflow: hidden;
    }
    .auth-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -4px rgba(79,70,229,.4); }
    .auth-btn:active { transform: translateY(0); box-shadow: none; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .auth-btn .spinner {
      display: none;
      width: 17px; height: 17px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: authSpin 0.6s linear infinite;
    }
    .auth-btn.loading .spinner { display: inline-block; }
    .auth-btn.loading .btn-text,
    .auth-btn.loading .btn-icon { display: none; }
    @keyframes authSpin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border, #e2e8f0);
      font-size: 12px;
      color: var(--ink-4);
    }
    .auth-footer i { font-size: 10px; }

    /* ── Theme Toggle ── */
    .auth-theme-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-lg, 12px);
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e2e8f0);
      color: var(--ink-3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 18px;
      box-shadow: var(--shadow-sm);
    }
    .auth-theme-btn:hover {
      box-shadow: var(--shadow-md);
      color: var(--ink);
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      body.auth-body { padding: 12px; align-items: flex-start; padding-top: 40px; }
      .auth-card {
        padding: 28px 18px 24px;
        border-radius: var(--radius-xl, 16px);
      }
      .auth-header { margin-bottom: 24px; }
      .auth-header h1 { font-size: 20px; }
      .auth-input { height: 46px; font-size: 16px; }
      .auth-btn { height: 46px; }
      .auth-logo { width: 54px; height: 54px; font-size: 25px; }
      .auth-theme-btn { top: 14px; right: 14px; width: 38px; height: 38px; }
    }
  </style>
</head>
<body class="auth-body">
  <!-- ─── ANIMATED BACKGROUND ─── -->
  <div class="auth-bg">
    <div class="auth-bg-gradient"></div>
    <div class="auth-bg-grid"></div>
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
  </div>

  <!-- ─── LOGIN CARD ─── -->
  <div class="auth-card-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="bi bi-archive-fill"></i>
        </div>
        <h1>Selamat Datang</h1>
        <p>Masuk untuk mengakses sistem kearsipan elektronik</p>
      </div>

      {{block "content" .}}{{end}}

      <div class="auth-footer">
        &copy; {{.Year}}{{if .LANIP}} &middot; <i class="bi bi-wifi"></i> {{.LANIP}}{{end}}
      </div>
    </div>
  </div>

  <!-- ─── THEME TOGGLE ─── -->
  <button class="auth-theme-btn" id="authThemeBtn" title="Toggle tema">
    <i class="bi bi-moon" id="authThemeIcon"></i>
  </button>

  <script>
  (function() {
    var html = document.documentElement;
    var t = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', t);
    var icon = document.getElementById('authThemeIcon');
    if (icon) icon.className = t === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
    document.getElementById('authThemeBtn').addEventListener('click', function() {
      var nt = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nt);
      localStorage.setItem('theme', nt);
      icon.className = nt === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
    });

    /* Ripple mouse tracking */
    document.addEventListener('mousemove', function(e) {
      var btn = e.target.closest('.auth-btn');
      if (btn) {
        var rect = btn.getBoundingClientRect();
        btn.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width * 100) + '%');
        btn.style.setProperty('--my', ((e.clientY - rect.top) / rect.height * 100) + '%');
      }
    });
  })();
  </script>
</body>
</html>
{{end}}
