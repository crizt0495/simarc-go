{{define "layouts/platinum-auth.html"}}
<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{.CSRFToken}}">
  <title>{{.title}} — {{.AppName}}</title>

  <link rel="icon" type="image/svg+xml" href="/images/logo-icon.svg?v={{.AssetVersion}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://code.jquery.com">

  <!-- Critical CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" fetchpriority="high">

  <!-- Non-critical: load icons async -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
  <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"></noscript>
  <link href="/css/neo-brutalism.min.css?v={{.AssetVersion}}" rel="stylesheet">

  <style>
    /* ── Premium Neo-Brutalism 2.0 auth shell — the component styles
         (auth-card, auth-logo, auth-input, buttons, orbs…) live in
         /css/neo-brutalism.min.css. This block only pins the fixed
         background layer and the transparent auth input treatment. ── */
    body.auth-body {
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.25rem;
    }
    .auth-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .auth-bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(var(--nb-border) 1.5px, transparent 1.5px),
        linear-gradient(90deg, var(--nb-border) 1.5px, transparent 1.5px);
      background-size: 42px 42px; opacity: 0.05;
    }
    .auth-input {
      width: 100%; height: 52px; padding: 0 16px 0 48px;
      border: none; background: transparent;
      font-size: 15px; font-weight: 600; color: var(--nb-ink); outline: none;
    }
    .auth-input::placeholder { color: var(--nb-ink-4); font-weight: 500; }

    /* Password-eye / theme toggle Hover presets (markup-driven) */
    .auth-btn .spinner {
      display: none; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    .auth-btn.loading .spinner { display: inline-block; }
    .auth-btn.loading .btn-text, .auth-btn.loading .btn-icon { display: none; }

    @media (max-width: 575.98px) {
      body.auth-body { padding: 0.75rem; align-items: flex-start; padding-top: 3rem; }
      .auth-input { height: 48px; font-size: 16px; }
    }
  </style>

  
</head>
<body class="auth-body">
  <!-- ANIMATED BACKGROUND -->
  <div class="auth-bg">
    <div class="auth-bg-gradient"></div>
    <div class="auth-bg-grid"></div>
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
  </div>

  <!-- LOGIN CARD -->
  <div class="auth-card-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="bi bi-archive-fill"></i>
        </div>
        <h1>Selamat Datang</h1>
        <p>Masuk untuk mengakses sistem kearsipan elektronik</p>
      </div>

      {{block "content" .}}{{end}}

      <div class="auth-footer">
        &copy; {{.Year}}{{if .LANIP}} &middot; <i class="bi bi-wifi"></i> {{.LANIP}}{{end}}
      </div>
    </div>
  </div>

  <!-- THEME TOGGLE -->
  <button class="auth-theme-btn" id="authThemeBtn" title="Toggle tema">
    <i class="bi bi-moon" id="authThemeIcon"></i>
  </button>

  <script>
  (function() {
    var html = document.documentElement;
    var t = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', t);
    var icon = document.getElementById('authThemeIcon');
    if (icon) icon.className = t === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
    document.getElementById('authThemeBtn').addEventListener('click', function() {
      html.classList.add('transitioning');
      var nt = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nt);
      localStorage.setItem('theme', nt);
      icon.className = nt === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
      setTimeout(function(){ html.classList.remove('transitioning'); }, 320);
    });
  })();
  </script>
</body>
</html>
{{end}}
