{{define "errors/503.html"}}<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layanan Tidak Tersedia - SIMARC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" fetchpriority="high">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"></noscript>
<style>
:root{--primary-900:#1e3a8a;--primary-500:#3b82f6;--neutral-900:#0f172a;--neutral-500:#64748b;--gradient-primary:linear-gradient(135deg,#3b82f6 0%,#1d4ed8 100%);--shadow-lg:0 10px 15px -3px rgba(0,0,0,0.08);--shadow-xl:0 20px 25px -5px rgba(0,0,0,0.08)}
[data-theme="dark"]{--primary-400:#60a5fa;--primary-500:#93c5fd;--neutral-900:#f8fafc;--neutral-500:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#fff7ed 0%,#fef3c7 50%,#fff7ed 100%);background-attachment:fixed;min-height:100vh;display:flex;align-items:safe center;justify-content:center;padding:2rem}
[data-theme="dark"] body{background:linear-gradient(135deg,#0a0e1a 0%,#1c1917 50%,#0a0e1a 100%)}
.error-container{text-align:center;max-width:600px;width:100%;position:relative;z-index:1}
.error-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:24px;padding:3rem 2rem;box-shadow:var(--shadow-xl);border:1px solid rgba(255,255,255,0.2);animation:slideUp 0.6s ease-out}
[data-theme="dark"] .error-card{background:rgba(15,23,42,0.95);border-color:rgba(51,65,85,0.5)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.error-icon{width:120px;height:120px;margin:0 auto 2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.5rem;background:linear-gradient(135deg,#f59e0b,#d97706);color:white}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.error-icon i{animation:pulse 1.5s ease-in-out infinite}
.error-code{font-family:'Playfair Display',serif;font-size:6rem;font-weight:700;background:linear-gradient(135deg,#f59e0b,#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:1rem}
.error-title{font-size:1.5rem;font-weight:700;color:var(--neutral-900);margin-bottom:1rem}
.error-message{font-size:1rem;color:var(--neutral-500);line-height:1.6;margin-bottom:2rem}
.btn-retry{display:inline-flex;align-items:center;gap:0.5rem;padding:0.875rem 2rem;background:var(--gradient-primary);color:white;border:none;border-radius:12px;font-weight:600;font-size:1rem;text-decoration:none;box-shadow:var(--shadow-lg);cursor:pointer}
.btn-retry:hover{transform:translateY(-2px);color:white}
@media(max-width:768px){.error-code{font-size:4rem}.error-icon{width:100px;height:100px;font-size:2.5rem}.error-card{padding:2rem 1.5rem}}
</style>
</head>
<body>
<div class="error-container">
<div class="error-card">
<div class="error-icon"><i class="bi bi-database-dash"></i></div>
<div class="error-code">503</div>
<h1 class="error-title">{{if .pageTitle}}{{.pageTitle}}{{else}}Layanan Tidak Tersedia{{end}}</h1>
<p class="error-message">{{if .Message}}{{.Message}}{{else}}Layanan sedang tidak tersedia. Silakan coba beberapa saat lagi.{{end}}</p>
<button onclick="location.reload()" class="btn-retry"><i class="bi bi-arrow-clockwise"></i> Coba Lagi</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>{{end}}
