{{define "errors/503.html"}}<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layanan Tidak Tersedia - SIMARC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" fetchpriority="high">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"></noscript>
<style>
:root{--brand:#4F46E5;--brand-dk:#4338CA;--brand-lt:rgba(79,70,229,.08);--ink:#0F172A;--ink-2:#1E293B;--ink-3:#475569;--ink-4:#94A3B8;--surface:#F8FAFC;--surface-2:#FFFFFF;--surface-3:#F1F5F9;--border:#E2E8F0;--border-2:#CBD5E1;--warning:#D97706;--warning-dk:#B45309;--warning-lt:rgba(217,119,6,.12);--r-sm:8px;--r:12px;--sh-lg:0 10px 15px -3px rgba(15,23,42,.1),0 4px 6px -4px rgba(15,23,42,.05);--shadow-dark:rgba(15,23,42,.08)}
[data-theme="dark"]{--brand:#818CF8;--brand-dk:#6366F1;--brand-lt:rgba(129,140,248,.15);--ink:#F8FAFC;--ink-2:#E2E8F0;--ink-3:#94A3B8;--ink-4:#64748B;--surface:#0F172A;--surface-2:#1E293B;--surface-3:#334155;--border:#334155;--border-2:#475569;--warning:#FBBF24;--warning-dk:#F59E0B;--warning-lt:rgba(251,191,36,.15);--shadow-dark:rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--surface);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;position:relative;overflow-x:hidden;color:var(--ink)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.error-container{text-align:center;max-width:600px;width:100%;position:relative;z-index:1}
.error-card{background:var(--surface-2);border-radius:var(--r-lg);padding:3rem 2rem;box-shadow:var(--sh-lg);border:1px solid var(--border);animation:slideUp 0.3s ease-out}
.error-icon{width:92px;height:92px;margin:0 auto 1.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:var(--warning-lt);color:var(--warning);border:none}
.error-code{font-weight:800;font-size:5rem;color:var(--ink);line-height:1;margin-bottom:0.5rem;letter-spacing:-.04em}
.error-title{font-size:1.4rem;font-weight:700;color:var(--ink);margin-bottom:0.75rem;letter-spacing:-.02em}
.error-message{font-size:0.95rem;color:var(--ink-3);line-height:1.6;margin-bottom:2rem}
.btn-retry{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.8rem 1.75rem;background:var(--brand);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:0.95rem;text-decoration:none;cursor:pointer;box-shadow:var(--sh-lg);transition:all 0.12s ease;font-family:inherit}
.btn-retry:hover{background:var(--brand-dk);box-shadow:var(--sh-lg);color:#fff}
.btn-retry:active{transform:scale(.985)}
@media(max-width:768px){.error-code{font-size:3.5rem}.error-card{padding:2rem 1.5rem}}
</style>
</head>
<body>
<div class="error-container">
<div class="error-card">
<div class="error-icon"><i class="bi bi-database-dash"></i></div>
<div class="error-code">503</div>
<h1 class="error-title">{{if .pageTitle}}{{.pageTitle}}{{else}}Layanan Tidak Tersedia{{end}}</h1>
<p class="error-message">{{if .Message}}{{.Message}}{{else}}Layanan sedang tidak tersedia. Silakan coba beberapa saat lagi.{{end}}</p>
<button onclick="location.reload()" class="btn-retry"><i class="bi bi-arrow-clockwise"></i> Coba Lagi</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>{{end}}
