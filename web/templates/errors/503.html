{{define "errors/503.html"}}<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layanan Tidak Tersedia - SIMARC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="/vendor/inter/inter.css?v={{.AssetVersion}}" rel="stylesheet">
<link href="/vendor/bootstrap/bootstrap.min.css?v={{.AssetVersion}}" rel="stylesheet" fetchpriority="high">
<link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css?v={{.AssetVersion}}" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css?v={{.AssetVersion}}"></noscript>
<style>
:root{--brand:#2563EB;--brand-dk:#1D4ED8;--brand-lt:rgba(37,99,235,.12);--ink:#0F172A;--ink-2:#1E293B;--ink-3:#475569;--ink-4:#56647C;--surface:#FFFFFF;--surface-2:#F8FAFD;--surface-3:#EEF1F6;--border:#E2E8F0;--border-2:#CBD5E1;--success:#047857;--success-dk:#065F46;--success-lt:rgba(4,120,87,.12);--danger:#DC2626;--danger-dk:#B91C1C;--danger-lt:rgba(220,38,38,.12);--warning:#B45309;--warning-dk:#92400E;--warning-lt:rgba(180,83,9,.14);--info:#0369A1;--info-dk:#075985;--info-lt:rgba(3,105,161,.12);--on-accent:#FFFFFF;--chip-bg:#E2E8F0;--chip-text:#1E293B;--r-sm:6px;--r:8px;--r-lg:12px;--r-xl:16px;--sh-sm:0 1px 2px rgba(15,23,42,.05);--sh:0 1px 2px rgba(15,23,42,.06),0 4px 12px -2px rgba(15,23,42,.06);--sh-lg:0 4px 6px -2px rgba(15,23,42,.06),0 12px 24px -6px rgba(15,23,42,.10);--shadow-dark:rgba(15,23,42,.14)}
[data-theme="dark"]{--brand:#5B8DEF;--brand-dk:#83A6F5;--brand-lt:rgba(91,141,239,.16);--ink:#E8EEF7;--ink-2:#D3DCE9;--ink-3:#A6B4C8;--ink-4:#8CA0BC;--surface:#111B2F;--surface-2:#16223A;--surface-3:#1E2C47;--border:#243450;--border-2:#334666;--success:#34D399;--success-dk:#5EE0B0;--success-lt:rgba(52,211,153,.15);--danger:#F87171;--danger-dk:#FCA5A5;--danger-lt:rgba(248,113,113,.15);--warning:#FBBF24;--warning-dk:#FCD34D;--warning-lt:rgba(251,191,36,.16);--info:#38BDF8;--info-dk:#7DD3FC;--info-lt:rgba(56,189,248,.16);--on-accent:#0B1220;--chip-bg:#263658;--chip-text:#D3DCE9;--sh-sm:0 1px 2px rgba(0,0,0,.4);--sh:0 4px 12px -2px rgba(0,0,0,.5);--sh-lg:0 12px 24px -6px rgba(0,0,0,.55);--shadow-dark:rgba(0,0,0,.5)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--surface);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;position:relative;overflow-x:hidden;color:var(--ink)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.error-container{text-align:center;max-width:600px;width:100%;position:relative;z-index:1}
.error-card{background:var(--surface-2);border-radius:var(--r-lg);padding:3rem 2rem;box-shadow:var(--sh-lg);border:2px solid var(--border);animation:slideUp 0.3s ease-out}
.error-icon{width:92px;height:92px;margin:0 auto 1.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:var(--warning-lt);color:var(--warning);border:none}
.error-code{font-weight:800;font-size:5rem;color:var(--ink);line-height:1;margin-bottom:0.5rem;letter-spacing:-.04em}
.error-title{font-size:1.4rem;font-weight:700;color:var(--ink);margin-bottom:0.75rem;letter-spacing:-.02em}
.error-message{font-size:0.95rem;color:var(--ink-3);line-height:1.6;margin-bottom:2rem}
.btn-retry{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.8rem 1.75rem;background:var(--brand);color:var(--on-accent);border:none;border-radius:10px;font-weight:600;font-size:0.95rem;text-decoration:none;cursor:pointer;box-shadow:var(--sh-lg);transition:all 0.12s ease;font-family:inherit}
.btn-retry:hover{background:var(--brand-dk);box-shadow:var(--sh-lg);color:var(--on-accent)}
.btn-retry:active{transform:scale(.985)}
@media(max-width:768px){.error-code{font-size:3.5rem}.error-card{padding:2rem 1.5rem}}
</style>
</head>
<body>
<div class="error-container">
<div class="error-card">
<div class="error-icon"><i class="bi bi-database-dash"></i></div>
<div class="error-code">503</div>
<h1 class="error-title">{{if .pageTitle}}{{.pageTitle}}{{else}}Layanan Tidak Tersedia{{end}}</h1>
<p class="error-message">{{if .Message}}{{.Message}}{{else}}Layanan sedang tidak tersedia. Silakan coba beberapa saat lagi.{{end}}</p>
<button onclick="location.reload()" class="btn-retry"><i class="bi bi-arrow-clockwise"></i> Coba Lagi</button>
</div>
</div>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js?v={{.AssetVersion}}"></script>
</body>
</html>{{end}}
