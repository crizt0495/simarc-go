{{define "errors/503.html"}}<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layanan Tidak Tersedia - SIMARC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" fetchpriority="high">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"></noscript>
<style>
:root{--accent:#4f46e5;--accent-strong:#4338ca;--ink:#1e293b;--ink-2:#334155;--ink-3:#64748b;--ink-4:#94a3b8;--surface:#fff;--surface-2:#f8fafc;--surface-3:#f1f5f9;--border:#e2e8f0;--border-2:#cbd5e1;--radius-lg:16px;--radius-md:8px;--shadow-sm:0 1px 3px rgba(15,23,42,.06);--shadow-md:0 10px 15px -3px rgba(15,23,42,.08);--shadow-lg:0 20px 25px -5px rgba(15,23,42,.1)}
[data-theme="dark"]{--accent:#6366f1;--accent-strong:#818cf8;--ink:#e2e8f0;--ink-2:#cbd5e1;--ink-3:#94a3b8;--ink-4:#64748b;--surface:#1e293b;--surface-2:#0f172a;--surface-3:#334155;--border:#334155;--border-2:#475569}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--surface-2);min-height:100vh;display:flex;align-items:safe center;justify-content:center;padding:2rem;position:relative;overflow-x:hidden;color:var(--ink)}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.error-container{text-align:center;max-width:600px;width:100%;position:relative;z-index:1}
.error-card{background:var(--surface);border-radius:var(--radius-lg);padding:3rem 2rem;box-shadow:var(--shadow-lg);border:1px solid var(--border);animation:slideUp 0.3s ease-out}
.error-icon{width:96px;height:96px;margin:0 auto 1.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:#d97706;color:#fff;box-shadow:0 8px 20px -4px rgba(217,119,6,.35)}
.error-code{font-weight:800;font-size:5.5rem;color:var(--ink);line-height:1;margin-bottom:0.5rem;letter-spacing:-.04em}
.error-title{font-size:1.4rem;font-weight:800;color:var(--ink);margin-bottom:0.75rem;letter-spacing:-.02em}
.error-message{font-size:0.95rem;color:var(--ink-3);line-height:1.6;margin-bottom:2rem;font-weight:500}
.btn-retry{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.75rem 1.75rem;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-md);font-weight:700;font-size:0.95rem;text-decoration:none;cursor:pointer;box-shadow:0 1px 2px rgba(79,70,229,.4);transition:all 0.15s ease;font-family:inherit}
.btn-retry:hover{transform:translateY(-1px);box-shadow:0 8px 20px -4px rgba(79,70,229,.4);color:#fff}
.btn-retry:active{transform:translateY(0);box-shadow:none}
@media(max-width:768px){.error-code{font-size:4rem}.error-card{padding:2rem 1.5rem}}
</style>
</head>
<body>
<div class="error-container">
<div class="error-card">
<div class="error-icon"><i class="bi bi-database-dash"></i></div>
<div class="error-code">503</div>
<h1 class="error-title">{{if .pageTitle}}{{.pageTitle}}{{else}}Layanan Tidak Tersedia{{end}}</h1>
<p class="error-message">{{if .Message}}{{.Message}}{{else}}Layanan sedang tidak tersedia. Silakan coba beberapa saat lagi.{{end}}</p>
<button onclick="location.reload()" class="btn-retry"><i class="bi bi-arrow-clockwise"></i> Coba Lagi</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>{{end}}
