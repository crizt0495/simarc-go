{{define "errors/404.html"}}<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman Tidak Ditemukan - SIMARC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="/vendor/inter/inter.css?v={{.AssetVersion}}" rel="stylesheet">
<link href="/vendor/bootstrap/bootstrap.min.css?v={{.AssetVersion}}" rel="stylesheet" fetchpriority="high">
<link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css?v={{.AssetVersion}}" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css?v={{.AssetVersion}}"></noscript>
<style>
:root{--brand:#B14A28;--brand-dk:#963B1E;--brand-lt:rgba(177,74,40,.12);--ink:#191510;--ink-2:#41352A;--ink-3:#6C5D49;--ink-4:#86765F;--surface:#F6F1E6;--surface-2:#FCF9F2;--surface-3:#ECE4D5;--border:#191510;--border-2:#CFC3B0;--on-accent:#FCF9F2;--r-sm:4px;--r:8px;--r-lg:12px;--r-xl:16px;--sh-sm:4px 4px 0 rgba(25,21,16,0.92);--sh:6px 6px 0 rgba(25,21,16,0.92);--sh-lg:8px 8px 0 rgba(25,21,16,0.92);--shadow-dark:rgba(25,21,16,0.92)}
[data-theme="dark"]{--brand:#D96A45;--brand-dk:#C75733;--brand-lt:rgba(217,106,69,.16);--ink:#F2EAE0;--ink-2:#D9CFC2;--ink-3:#B3A596;--ink-4:#91826F;--surface:#15120E;--surface-2:#1C1914;--surface-3:#262117;--border:#000000;--border-2:#4A4034;--on-accent:#16130E;--sh-sm:4px 4px 0 rgba(0,0,0,.5);--sh:6px 6px 0 rgba(0,0,0,.55);--sh-lg:8px 8px 0 rgba(0,0,0,.6);--shadow-dark:rgba(0,0,0,.5)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--surface);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;position:relative;overflow-x:hidden;color:var(--ink)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.error-container{text-align:center;max-width:600px;width:100%;position:relative;z-index:1}
.error-card{background:var(--surface-2);border-radius:var(--r-lg);padding:3rem 2rem;box-shadow:var(--sh-lg);border:2px solid var(--border);animation:slideUp 0.3s ease-out}
.error-icon{width:92px;height:92px;margin:0 auto 1.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:var(--brand-lt);color:var(--brand);border:none}
.error-code{font-weight:800;font-size:5rem;color:var(--ink);line-height:1;margin-bottom:0.5rem;letter-spacing:-.04em}
.error-title{font-size:1.4rem;font-weight:700;color:var(--ink);margin-bottom:0.75rem;letter-spacing:-.02em}
.error-message{font-size:0.95rem;color:var(--ink-3);line-height:1.6;margin-bottom:2rem}
.btn-back{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.8rem 1.75rem;background:var(--brand);color:var(--on-accent);border:none;border-radius:10px;font-weight:600;font-size:0.95rem;text-decoration:none;box-shadow:var(--sh);transition:all 0.12s ease}
.btn-back:hover{background:var(--brand-dk);box-shadow:var(--sh-lg);color:var(--on-accent)}
.btn-back:active{transform:scale(.985)}
.home-link{display:inline-block;margin-top:1rem;color:var(--brand);text-decoration:none;font-weight:600;transition:color 0.15s ease}
.home-link:hover{color:var(--brand-dk)}
.theme-toggle{position:absolute;top:1.5rem;right:1.5rem;width:42px;height:42px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s ease;z-index:10;color:var(--ink-3)}
.theme-toggle:hover{color:var(--ink);border-color:var(--border-2)}
.theme-toggle i{font-size:1.1rem;color:var(--brand)}
@media(max-width:768px){.error-code{font-size:3.5rem}.error-card{padding:2rem 1.5rem}}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><i class="bi bi-moon" id="themeIcon"></i></button>
<div class="error-container">
<div class="error-card">
<div class="error-icon"><i class="bi bi-search"></i></div>
<div class="error-code">404</div>
<h1 class="error-title">Halaman Tidak Ditemukan</h1>
<p class="error-message">{{if .Message}}{{.Message}}{{else}}Maaf, halaman yang Anda cari tidak dapat ditemukan. Mungkin halaman telah dipindahkan atau dihapus.{{end}}</p>
<div class="error-actions">
<a href="javascript:history.back()" class="btn-back"><i class="bi bi-arrow-left"></i><span class="d-none d-sm-inline">Kembali</span></a><br>
<a href="/dashboard" class="home-link"><i class="bi bi-house-door me-1"></i>Ke Dashboard</a>
</div>
</div>
</div>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js?v={{.AssetVersion}}"></script>
<script>
(function(){var html=document.documentElement;var savedTheme=localStorage.getItem('theme')||'light';html.setAttribute('data-theme',savedTheme);var themeIcon=document.getElementById('themeIcon');if(themeIcon){themeIcon.className=savedTheme==='dark'?'bi bi-sun':'bi bi-moon'}var themeToggle=document.getElementById('themeToggle');if(themeToggle){themeToggle.addEventListener('click',function(){var currentTheme=html.getAttribute('data-theme');var newTheme=currentTheme==='light'?'dark':'light';html.setAttribute('data-theme',newTheme);localStorage.setItem('theme',newTheme);themeIcon.className=newTheme==='dark'?'bi bi-sun':'bi bi-moon'})}})();
</script>
</body>
</html>{{end}}
