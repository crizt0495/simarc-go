{{define "errors/403.html"}}<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akses Ditolak - SIMARC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" fetchpriority="high">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"></noscript>
<style>
:root{--brand:#6C5CE7;--brand-dk:#5A4BD4;--brand-lt:rgba(108,92,231,.16);--ink:#262626;--ink-2:#3A3A3A;--ink-3:#5C6470;--ink-4:#9099A6;--surface:#FAF6EF;--surface-2:#FFFFFF;--surface-3:#F0EADF;--border:#262626;--border-2:#3A3A3A;--maroon:#E07A5F;--maroon-dk:#C75F45;--r-sm:6px;--r:10px;--sh-lg:6px 6px 0 rgba(38,38,38,.24);--shadow-dark:rgba(38,38,38,.22)}
[data-theme="dark"]{--brand:#8B7CF0;--brand-dk:#A79BF5;--brand-lt:rgba(139,124,240,.18);--ink:#F5F2EA;--ink-2:#E7E2D6;--ink-3:#C1C4CD;--ink-4:#9099A6;--surface:#1B1B24;--surface-2:#24242F;--surface-3:#30303D;--border:#3C3C4A;--border-2:#4C4C5C;--maroon:#F2937C;--maroon-dk:#F7A894;--shadow-dark:rgba(0,0,0,.55)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--surface);min-height:100vh;display:flex;align-items:safe center;justify-content:center;padding:2rem;position:relative;overflow-x:hidden;color:var(--ink)}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.error-container{text-align:center;max-width:600px;width:100%;position:relative;z-index:1}
.error-card{background:var(--surface-2);border-radius:var(--r);padding:3rem 2rem;box-shadow:var(--sh-lg);border:2px solid var(--border);animation:slideUp 0.3s ease-out}
.error-icon{width:104px;height:104px;margin:0 auto 1.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:var(--maroon);color:var(--ink);border:2px solid var(--border);box-shadow:5px 5px 0 var(--shadow-dark)}
.error-code{font-weight:900;font-size:5.5rem;color:var(--ink);line-height:1;margin-bottom:0.5rem;letter-spacing:-.04em}
.error-title{font-size:1.4rem;font-weight:800;color:var(--ink);margin-bottom:0.75rem;letter-spacing:-.02em}
.error-message{font-size:0.95rem;color:var(--ink-3);line-height:1.6;margin-bottom:2rem;font-weight:500}
.btn-back{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.8rem 1.75rem;background:var(--brand);color:var(--ink);border:2px solid var(--border);border-radius:var(--r-sm);font-weight:800;font-size:0.95rem;text-decoration:none;box-shadow:4px 4px 0 var(--shadow-dark);transition:all 0.12s ease}
.btn-back:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow-dark);background:var(--brand-dk);color:var(--ink)}
.btn-back:active{transform:translate(3px,3px);box-shadow:none}
.home-link{display:inline-block;margin-top:1rem;color:var(--brand);text-decoration:none;font-weight:700;transition:color 0.15s ease}
.home-link:hover{color:var(--brand-dk)}
.theme-toggle{position:absolute;top:1.5rem;right:1.5rem;width:44px;height:44px;background:var(--surface-2);border:2px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s ease;z-index:10;box-shadow:3px 3px 0 var(--shadow-dark);color:var(--ink-3)}
.theme-toggle:hover{color:var(--ink);box-shadow:4px 4px 0 var(--shadow-dark);transform:translate(-1px,-1px)}
.theme-toggle:active{box-shadow:none;transform:translate(2px,2px)}
.theme-toggle i{font-size:1.1rem;color:var(--brand)}
@media(max-width:768px){.error-code{font-size:4rem}.error-card{padding:2rem 1.5rem}}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><i class="bi bi-moon" id="themeIcon"></i></button>
<div class="error-container">
<div class="error-card">
<div class="error-icon"><i class="bi bi-lock-fill"></i></div>
<div class="error-code">403</div>
<h1 class="error-title">Akses Ditolak</h1>
<p class="error-message">Maaf, Anda tidak memiliki izin untuk mengakses halaman ini. Silakan hubungi administrator jika Anda memerlukan akses.</p>
<div class="error-actions">
<a href="javascript:history.back()" class="btn-back"><i class="bi bi-arrow-left"></i><span class="d-none d-sm-inline">Kembali</span></a><br>
<a href="/dashboard" class="home-link"><i class="bi bi-house-door me-1"></i>Ke Dashboard</a>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){var html=document.documentElement;var savedTheme=localStorage.getItem('theme')||'light';html.setAttribute('data-theme',savedTheme);var themeIcon=document.getElementById('themeIcon');if(themeIcon){themeIcon.className=savedTheme==='dark'?'bi bi-sun':'bi bi-moon'}var themeToggle=document.getElementById('themeToggle');if(themeToggle){themeToggle.addEventListener('click',function(){var currentTheme=html.getAttribute('data-theme');var newTheme=currentTheme==='light'?'dark':'light';html.setAttribute('data-theme',newTheme);localStorage.setItem('theme',newTheme);themeIcon.className=newTheme==='dark'?'bi bi-sun':'bi bi-moon'})}})();
</script>
</body>
</html>{{end}}
