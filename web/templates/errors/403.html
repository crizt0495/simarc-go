{{define "errors/403.html"}}<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akses Ditolak - ArsipPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" fetchpriority="high">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"></noscript>
<style>
:root{--primary-900:var(--ink-2);--primary-500:var(--ink-2);--primary-400:var(--ink-3);--danger-500:var(--ink-2);--warning-500:var(--ink-2);--success-500:var(--ink-2);--info-500:var(--ink-3);--neutral-900:var(--ink);--neutral-500:#64748b;--gradient-primary:linear-gradient(135deg,var(--ink-2) 0%,var(--ink-2) 100%);--shadow-lg:0 10px 15px -3px rgba(0,0,0,0.08),0 4px 6px -4px rgba(0,0,0,0.08);--shadow-xl:0 20px 25px -5px rgba(0,0,0,0.08),0 8px 10px -6px rgba(0,0,0,0.08)}
[data-theme="dark"]{--primary-400:var(--ink-3);--primary-500:var(--ink-3);--neutral-900:var(--neu-bg);--neutral-500:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#f0f4ff 0%,#e8efff 50%,#f0f4ff 100%);background-attachment:fixed;min-height:100vh;display:flex;align-items:safe center;justify-content:center;padding:2rem;position:relative;overflow-x:hidden}
[data-theme="dark"] body{background:linear-gradient(135deg,#2d3748 0%,var(--ink) 50%,#2d3748 100%)}
body::before,body::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.1) 0%,transparent 70%);animation:float 20s ease-in-out infinite;pointer-events:none;z-index:0}
body::before{top:-200px;right:-200px}
body::after{bottom:-200px;left:-200px;animation-delay:-10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-50px) scale(1.1)}66%{transform:translate(-20px,30px) scale(0.9)}}
.error-container{text-align:center;max-width:600px;width:100%;position:relative;z-index:1}
.error-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:24px;padding:3rem 2rem;box-shadow:var(--shadow-xl);border:1px solid rgba(255,255,255,0.2);animation:slideUp 0.6s ease-out}
[data-theme="dark"] .error-card{background:rgba(15,23,42,0.95);border-color:rgba(51,65,85,0.5)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.error-icon{width:120px;height:120px;margin:0 auto 2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.5rem;position:relative}
.error-icon::before{content:'';position:absolute;inset:-10px;border-radius:50%;background:var(--gradient-primary);opacity:0.2;filter:blur(20px);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:0.3;transform:scale(1.1)}}
.error-icon.error-403{background:linear-gradient(135deg,var(--ink-2),var(--ink-2));color:white}
.error-icon.error-404{background:linear-gradient(135deg,var(--ink-2),var(--ink-2));color:white}
.error-code{font-family:'Playfair Display',serif;font-size:6rem;font-weight:700;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:1rem}
.error-title{font-size:1.5rem;font-weight:700;color:var(--neutral-900);margin-bottom:1rem}
[data-theme="dark"] .error-title{color:var(--neutral-900)}
.error-message{font-size:1rem;color:var(--neutral-500);line-height:1.6;margin-bottom:2rem}
.btn-back{display:inline-flex;align-items:center;gap:0.5rem;padding:0.875rem 2rem;background:var(--gradient-primary);color:white;border:none;border-radius:12px;font-weight:600;font-size:1rem;text-decoration:none;box-shadow:var(--shadow-lg);transition:all 0.3s ease;position:relative;overflow:hidden}
.btn-back::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.5s ease}
.btn-back:hover{transform:translateY(-2px);box-shadow:var(--shadow-xl);color:white}
.btn-back:hover::before{left:100%}
.home-link{display:inline-block;margin-top:1rem;color:var(--primary-500);text-decoration:none;font-weight:600;transition:all 0.3s ease}
.home-link:hover{color:var(--primary-900);transform:translateX(4px)}
[data-theme="dark"] .home-link{color:var(--primary-500)}
.theme-toggle{position:absolute;top:2rem;right:2rem;width:48px;height:48px;background:rgba(255,255,255,0.95);border:1px solid rgba(226,232,240,0.5);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s ease;z-index:10;box-shadow:var(--shadow-lg)}
[data-theme="dark"] .theme-toggle{background:rgba(30,41,59,0.95);border-color:rgba(51,65,85,0.5)}
.theme-toggle:hover{transform:rotate(15deg)}
.theme-toggle i{font-size:1.25rem;color:var(--primary-900)}
@media(max-width:768px){.error-code{font-size:4rem}.error-icon{width:100px;height:100px;font-size:2.5rem}.error-card{padding:2rem 1.5rem}}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><i class="bi bi-moon" id="themeIcon"></i></button>
<div class="error-container">
<div class="error-card">
<div class="error-icon error-403"><i class="bi bi-lock-fill"></i></div>
<div class="error-code">403</div>
<h1 class="error-title">Akses Ditolak</h1>
<p class="error-message">Maaf, Anda tidak memiliki izin untuk mengakses halaman ini. Silakan hubungi administrator jika Anda memerlukan akses.</p>
<div class="error-actions">
<a href="javascript:history.back()" class="btn-back"><i class="bi bi-arrow-left"></i><span class="d-none d-sm-inline">Kembali</span></a><br>
<a href="/dashboard" class="home-link"><i class="bi bi-house-door me-1"></i>Ke Dashboard</a>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){var html=document.documentElement;var savedTheme=localStorage.getItem('theme')||'light';html.setAttribute('data-theme',savedTheme);var themeIcon=document.getElementById('themeIcon');if(themeIcon){themeIcon.className=savedTheme==='dark'?'bi bi-sun':'bi bi-moon'}var themeToggle=document.getElementById('themeToggle');if(themeToggle){themeToggle.addEventListener('click',function(){var currentTheme=html.getAttribute('data-theme');var newTheme=currentTheme==='light'?'dark':'light';html.setAttribute('data-theme',newTheme);localStorage.setItem('theme',newTheme);themeIcon.className=newTheme==='dark'?'bi bi-sun':'bi bi-moon'})}})();
</script>
</body>
</html>{{end}}
