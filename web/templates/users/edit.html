{{define "users/edit.html"}}{{template "layouts/app.html" .}}{{end}}
{{define "content"}}
<style>
.edit-header { background: linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 50%, var(--ink-2) 100%); border-radius: var(--r-xl); padding: 1.75rem 2rem; position: relative; overflow: hidden; margin-bottom: 1.5rem; animation: slideUp 0.35s ease both; }
.edit-header::after { content: ''; position: absolute; top: -50%; right: -10%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
.edit-header h4 { color: #fff; font-weight: 800; letter-spacing: -0.03em; position: relative; z-index: 1; margin: 0; }
.edit-header p { color: rgba(255,255,255,0.65); font-size: 0.8rem; position: relative; z-index: 1; margin: 0.15rem 0 0 0; }
.edit-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-sm); overflow: hidden; animation: slideUp 0.35s ease 0.08s both; }
.edit-card .card-body-custom { padding: 1.75rem; }
.form-field { margin-bottom: 1.25rem; }
.form-field label { display: block; font-weight: 600; font-size: 0.8rem; color: var(--ink-2); margin-bottom: 0.35rem; }
.form-field label .required { color: var(--ink-2); margin-left: 2px; }
.form-field .form-control, .form-field .form-select { width: 100%; padding: 0.55rem 0.85rem; border: 1.5px solid var(--border); border-radius: var(--r); font-size: 0.85rem; color: var(--ink); background: var(--surface); transition: all 0.18s ease; outline: none; font-family: inherit; }
.form-field .form-control:focus, .form-field .form-select:focus { border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
@media (max-width:768px) { .edit-header { padding: 1.25rem; } .edit-card .card-body-custom { padding: 1rem; } }
</style>

<div class="container-fluid py-3 py-xl-4">
    <div class="edit-header shadow-sm">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h4><i class="bi bi-person-edit me-2"></i>Edit Pengguna</h4>
                <p>Perbarui data pengguna sistem</p>
            </div>
            <a href="/users" class="btn btn-light btn-sm rounded-pill fw-700 px-3" style="font-size:0.75rem;">
                <i class="bi bi-arrow-left me-1"></i><span class="d-none d-sm-inline">Kembali</span>
            </a>
        </div>
    </div>

    <div class="edit-card">
        <div class="card-body-custom">
            <form method="POST" action="/users/{{.User.ID}}" class="confirm-submit" data-confirm-type="edit">

                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-field">
                            <label>Username <span class="required">*</span></label>
                            <input type="text" name="username" class="form-control" value="{{.User.Username}}" required placeholder="Masukkan username">
                            <div class="form-text" style="font-size:0.75rem;color:var(--ink-4);margin-top:0.3rem;">Username harus unik</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-field">
                            <label>Nama Lengkap <span class="required">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{.User.Name}}" required placeholder="Masukkan nama lengkap">
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-field">
                            <label>Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Kosongkan jika tidak diubah" autocomplete="new-password">
                            <div class="form-text" style="font-size:0.75rem;color:var(--ink-4);margin-top:0.3rem;">Minimal 8 karakter. Kosongkan jika tidak ingin mengubah password.</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-field">
                            <label>Konfirmasi Password</label>
                            <input type="password" name="password_confirmation" class="form-control" placeholder="Ulangi password baru" autocomplete="new-password">
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-field">
                            <label>Role <span class="required">*</span></label>
                            <select name="role_id" class="form-select" required>
                                <option value="">Pilih role</option>
                                {{range .roles}}
                                <option value="{{.ID}}" {{if eq .ID $.User.RoleID}}selected{{end}}>
                                    {{.Name}}
                                </option>
                                {{end}}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-field">
                            <label>Unit Kerja</label>
                            <select name="unit_kerja_id" class="form-select">
                                <option value="">Tidak ada unit kerja</option>
                                {{range .unitKerja}}
                                <option value="{{.ID}}" {{if eq .ID $.User.UnitKerjaID}}selected{{end}}>
                                    {{.NamaUnit}}
                                </option>
                                {{end}}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mb-3 d-flex align-items-center gap-2">
                    <input type="checkbox" class="form-check-input" id="is_active" name="is_active" value="1" style="width:1.1rem;height:1.1rem;margin-top:0;" {{if .User.IsActive}}checked{{end}}>
                    <label class="form-check-label" for="is_active" style="font-weight:600;font-size:0.8rem;color:var(--ink-2);">Aktif</label>
                </div>

                <div class="d-flex justify-content-between pt-2 border-top" style="border-color:var(--border)!important;">
                    <a href="/users" class="btn btn-secondary btn-sm rounded-pill fw-700 px-3" style="font-size:0.8rem;">
                        <i class="bi bi-x-circle me-1"></i>Batal
                    </a>
                    <button type="submit" class="btn btn-primary rounded-pill fw-800 px-4 py-2 shadow-sm" style="font-size:0.85rem;">
                        <i class="bi bi-check-circle-fill me-2"></i>Update Pengguna
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}
