{{define "components/select2.html"}}
<style>
    .select2-container--default .select2-selection--single .select2-selection__placeholder {
        color: #64748b;
    }
    .select2-container .select2-selection--single {
        height: 48px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        background-color: #fff;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
        line-height: 44px;
        color: var(--ink-3);
        padding-left: 16px;
        font-weight: 500;
        font-size: 0.95rem;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
        height: 46px;
        right: 16px;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow b {
        border-color: #475569 transparent transparent transparent;
        border-width: 6px 6px 0 6px;
    }
    .select2-container--focus .select2-selection--single {
        border-color: #475569;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15),
                    0 4px 12px rgba(102, 126, 234, 0.1);
    }
    .select2-container:hover .select2-selection--single {
        border-color: #cbd5e1;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .select2-dropdown {
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        background-color: #fff;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12),
                    0 0 0 1px rgba(0, 0, 0, 0.04);
        overflow: hidden;
        margin-top: 8px;
    }
    .select2-search--dropdown {
        padding: 12px;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.02) 0%, rgba(118, 75, 162, 0.02) 100%);
        border-bottom: 2px solid #e2e8f0;
    }
    .select2-search--dropdown .select2-search__field {
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        padding: 10px 16px;
        background-color: #fff;
        color: var(--ink-3);
        font-size: 0.95rem;
        font-weight: 500;
        transition: all 0.2s ease;
    }
    .select2-search--dropdown .select2-search__field:focus {
        outline: none;
        border-color: #475569;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
    }
    .select2-search--dropdown .select2-search__field::placeholder {
        color: #94a3b8;
    }
    .select2-results__options {
        padding: 8px 0;
    }
    .select2-results__option {
        padding: 12px 16px;
        color: var(--ink-3);
        background-color: #fff;
        font-weight: 500;
        font-size: 0.9rem;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .select2-results__option:hover {
        background-color: var(--neu-bg);
        transform: translateX(4px);
    }
    .select2-results__option--highlighted[aria-selected] {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        color: #475569;
        transform: translateX(0);
    }
    .select2-results__option[aria-selected="true"] {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
        color: #475569;
        font-weight: 600;
    }
    .select2-results__option[aria-selected="true"]:hover {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
    }
    .select2-option-with-icon {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .select2-option-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        flex-shrink: 0;
    }
    .select2-option-icon.klasifikasi {
        background: linear-gradient(135deg, #475569 0%, var(--ink-2) 100%);
        color: #fff;
    }
    .select2-option-icon.lokasi {
        background: linear-gradient(135deg, var(--ink-2) 0%, var(--ink-2) 100%);
        color: #fff;
    }
    .select2-option-icon.jenis {
        background: linear-gradient(135deg, var(--ink-2) 0%, var(--ink-2) 100%);
        color: #fff;
    }
    .select2-option-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .select2-option-title {
        font-weight: 600;
        font-size: 0.9rem;
    }
    .select2-option-subtitle {
        font-size: 0.8rem;
        color: #64748b;
        font-weight: 500;
    }
    .select2-results__option--highlighted .select2-option-subtitle {
        color: #94a3b8;
    }
    .select2-selection__rendered .select2-selection-with-icon {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .select2-selection__rendered .select2-selection-icon {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        color: #fff;
    }
    .select2-container--default .select2-selection--multiple {
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        min-height: 48px;
        padding: 4px;
        transition: all 0.2s ease;
    }
    .select2-container--default .select2-selection--multiple .select2-selection__choice {
        background: linear-gradient(135deg, #475569 0%, var(--ink-2) 100%);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 4px 10px;
        margin: 4px;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        margin-right: 4px;
    }
    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
        color: #fff;
    }
    .select2-container--focus .select2-selection--multiple {
        border-color: #475569;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
    }
    .select2-results__message {
        padding: 16px;
        text-align: center;
        color: #64748b;
        font-style: italic;
    }
    [data-theme="dark"] .select2-container .select2-selection--single {
        background-color: var(--ink-2);
        border-color: var(--ink-3);
    }
    [data-theme="dark"] .select2-container--default .select2-selection--single .select2-selection__rendered {
        color: var(--surface-3);
    }
    [data-theme="dark"] .select2-container--default .select2-selection--single .select2-selection__arrow b {
        border-color: #94a3b8 transparent transparent transparent;
    }
    [data-theme="dark"] .select2-dropdown {
        background-color: var(--ink-2);
        border-color: var(--ink-3);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4),
                    0 0 0 1px rgba(255, 255, 255, 0.04);
    }
    [data-theme="dark"] .select2-search--dropdown {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
        border-bottom-color: var(--ink-3);
    }
    [data-theme="dark"] .select2-search--dropdown .select2-search__field {
        background-color: var(--ink);
        border-color: var(--ink-4);
        color: var(--surface-3);
    }
    [data-theme="dark"] .select2-search--dropdown .select2-search__field:focus {
        border-color: #475569;
    }
    [data-theme="dark"] .select2-results__option {
        background-color: var(--ink-2);
        color: var(--surface-3);
    }
    [data-theme="dark"] .select2-results__option:hover {
        background-color: var(--ink-3);
    }
    [data-theme="dark"] .select2-results__option--highlighted[aria-selected] {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
        color: #475569;
    }
    [data-theme="dark"] .select2-results__option[aria-selected="true"] {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.25) 0%, rgba(118, 75, 162, 0.25) 100%);
        color: #475569;
    }
    [data-theme="dark"] .select2-container--focus .select2-selection--single {
        border-color: #475569;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
    }
    [data-theme="dark"] .select2-selection__choice {
        background: linear-gradient(135deg, #475569 0%, var(--ink-2) 100%) !important;
    }
    @media (max-width: 768px) {
        .select2-container .select2-selection--single {
            height: 44px;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 40px;
            font-size: 1rem;
        }
        .select2-option-icon {
            width: 28px;
            height: 28px;
            font-size: 0.9rem;
        }
    }
</style>
<script>
(function() {
  function initSelect2Icons() {
    if (typeof jQuery === 'undefined' || typeof jQuery.fn === 'undefined' || typeof jQuery.fn.select2 === 'undefined') {
      setTimeout(initSelect2Icons, 100);
      return;
    }
    jQuery('.select2-search').each(function() {
      var $this = jQuery(this);
      if ($this.data('s2-icons')) return;
      $this.data('s2-icons', true);
      var type = $this.data('type') || 'default';
      $this.select2({
        placeholder: function() {
          return jQuery(this).attr('placeholder') || 'Pilih...';
        },
        allowClear: true,
        width: '100%',
        language: {
          searching: function() { return 'Mencari...'; },
          noResults: function() { return 'Tidak ditemukan'; },
          inputTooShort: function() { return 'Masukkan minimal 2 karakter'; }
        },
        minimumInputLength: 0,
        templateResult: function(option) {
          if (!option.id) return option.text;
          if (type === 'klasifikasi' && option.element) {
            var $el = jQuery(option.element);
            var kode = $el.data('kode') || '';
            var nama = $el.data('nama') || option.text;
            return jQuery('<span class="select2-option-with-icon"><span class="select2-option-icon klasifikasi"><i class="bi bi-folder"></i></span><span class="select2-option-content"><span class="select2-option-title">' + nama + '</span><span class="select2-option-subtitle">' + kode + '</span></span></span>');
          }
          if (type === 'lokasi' && option.element) {
            var $el = jQuery(option.element);
            var nama = $el.data('nama') || option.text;
            return jQuery('<span class="select2-option-with-icon"><span class="select2-option-icon lokasi"><i class="bi bi-geo-alt"></i></span><span class="select2-option-content"><span class="select2-option-title">' + nama + '</span></span></span>');
          }
          if (type === 'jenis' && option.element) {
            var $el = jQuery(option.element);
            var kode = $el.data('kode') || '';
            var nama = $el.data('nama') || option.text;
            return jQuery('<span class="select2-option-with-icon"><span class="select2-option-icon jenis"><i class="bi bi-tag"></i></span><span class="select2-option-content"><span class="select2-option-title">' + nama + '</span><span class="select2-option-subtitle">' + kode + '</span></span></span>');
          }
          return option.text;
        },
        templateSelection: function(option) {
          if (!option.id) return option.text;
          if (type === 'klasifikasi' && option.element) {
            var $el = jQuery(option.element);
            var nama = $el.data('nama') || option.text;
            var kode = $el.data('kode') || '';
            return jQuery('<span class="select2-selection-with-icon"><span class="select2-selection-icon klasifikasi"><i class="bi bi-folder"></i></span><span>' + nama + ' (' + kode + ')</span></span>');
          }
          if (type === 'lokasi' && option.element) {
            var $el = jQuery(option.element);
            var nama = $el.data('nama') || option.text;
            return jQuery('<span class="select2-selection-with-icon"><span class="select2-selection-icon lokasi"><i class="bi bi-geo-alt"></i></span><span>' + nama + '</span></span>');
          }
          if (type === 'jenis' && option.element) {
            var $el = jQuery(option.element);
            var nama = $el.data('nama') || option.text;
            var kode = $el.data('kode') || '';
            return jQuery('<span class="select2-selection-with-icon"><span class="select2-selection-icon jenis"><i class="bi bi-tag"></i></span><span>' + nama + ' (' + kode + ')</span></span>');
          }
          return option.text;
        }
      });
    });
  }
  initSelect2Icons();
})();
</script>
{{end}}
