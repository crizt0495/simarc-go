{{define "components/select2.html"}}
<style>
    .select2-container--default .select2-selection--single .select2-selection__placeholder {
        color: var(--nb-ink-4);
    }
    .select2-container .select2-selection--single {
        height: 40px;
        border: 2px solid var(--nb-border) !important;
        border-radius: 0 !important;
        background-color: var(--nb-surface) !important;
        box-shadow: 2px 2px 0 0 var(--nb-ink);
        transition: all 0.1s;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
        line-height: 36px;
        color: var(--nb-ink);
        padding-left: 16px;
        font-weight: 600;
        font-size: 0.82rem;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
        height: 36px;
        right: 16px;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow b {
        border-color: var(--nb-ink) transparent transparent transparent;
        border-width: 6px 6px 0 6px;
    }
    .select2-container--default.select2-container--open .select2-selection--single,
    .select2-container--default .select2-selection--single:focus {
        border-color: var(--nb-primary) !important;
        box-shadow: 3px 3px 0 0 var(--nb-primary);
    }
    .select2-container:hover .select2-selection--single {
        border-color: var(--nb-border);
        box-shadow: 2px 2px 0 0 var(--nb-ink);
    }
    .select2-dropdown {
        border: 2px solid var(--nb-border) !important;
        border-radius: 0 !important;
        background-color: var(--nb-surface) !important;
        box-shadow: var(--nb-shadow-lg) !important;
        overflow: hidden;
        margin-top: 4px;
    }
    .select2-search--dropdown {
        padding: 0.5rem;
        background: var(--nb-surface-2);
        border-bottom: 2px solid var(--nb-border);
    }
    .select2-search--dropdown .select2-search__field {
        border: 2px solid var(--nb-border) !important;
        border-radius: 0 !important;
        padding: 0.4rem 0.6rem;
        background-color: var(--nb-surface) !important;
        color: var(--nb-ink) !important;
        font-size: 0.82rem;
        font-weight: 600;
    }
    .select2-search--dropdown .select2-search__field:focus {
        outline: none;
        border-color: var(--nb-primary) !important;
        box-shadow: 3px 3px 0 0 var(--nb-primary);
    }
    .select2-search--dropdown .select2-search__field::placeholder {
        color: var(--nb-ink-4);
    }
    .select2-results__options {
        padding: 0.25rem 0;
    }
    .select2-results__option {
        padding: 0.5rem 0.75rem;
        color: var(--nb-ink-3);
        background-color: var(--nb-surface) !important;
        font-weight: 600;
        font-size: 0.82rem;
        transition: all 0.08s;
    }
    .select2-results__option:hover {
        background-color: var(--nb-primary-light) !important;
        color: var(--nb-primary) !important;
    }
    .select2-results__option--highlighted[aria-selected] {
        background: var(--nb-primary) !important;
        color: #fff !important;
    }
    .select2-results__option[aria-selected="true"] {
        background: var(--nb-primary-light) !important;
        color: var(--nb-primary) !important;
        font-weight: 700;
    }
    .select2-results__option[aria-selected="true"]:hover {
        background: var(--nb-primary-light) !important;
    }
    .select2-option-with-icon {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .select2-option-icon {
        width: 32px;
        height: 32px;
        border: 2px solid var(--nb-border);
        box-shadow: 2px 2px 0 0 var(--nb-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        flex-shrink: 0;
        background: var(--nb-surface-2);
        color: var(--nb-ink);
    }
    .select2-option-icon.klasifikasi { background: var(--nb-primary); color: #fff; }
    .select2-option-icon.lokasi { background: var(--nb-success); color: #fff; }
    .select2-option-icon.jenis { background: var(--nb-warning); color: var(--nb-ink); }
    .select2-option-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .select2-option-title { font-weight: 600; font-size: 0.9rem; }
    .select2-option-subtitle { font-size: 0.8rem; color: var(--nb-ink-4); font-weight: 500; }
    .select2-results__option--highlighted .select2-option-subtitle { color: rgba(255,255,255,0.8); }
    .select2-selection__rendered .select2-selection-with-icon {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .select2-selection__rendered .select2-selection-icon {
        width: 28px;
        height: 28px;
        border: 2px solid var(--nb-border);
        box-shadow: 2px 2px 0 0 var(--nb-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        color: #fff;
        background: var(--nb-primary);
    }
    .select2-container--default .select2-selection--multiple {
        border: 2px solid var(--nb-border) !important;
        border-radius: 0 !important;
        min-height: 40px;
        padding: 4px;
        box-shadow: 2px 2px 0 0 var(--nb-ink);
        transition: all 0.1s;
    }
    .select2-container--default .select2-selection--multiple .select2-selection__choice {
        background: var(--nb-primary) !important;
        color: #fff !important;
        border: 2px solid var(--nb-border) !important;
        box-shadow: 2px 2px 0 0 var(--nb-ink);
        border-radius: 0 !important;
        padding: 4px 10px;
        margin: 4px;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        margin-right: 4px;
    }
    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover { color: #fff; }
    .select2-container--default.select2-container--open .select2-selection--multiple,
    .select2-container--focus .select2-selection--multiple {
        border-color: var(--nb-primary) !important;
        box-shadow: 3px 3px 0 0 var(--nb-primary);
    }
    .select2-results__message {
        padding: 16px;
        text-align: center;
        color: var(--nb-ink-4);
        font-style: italic;
    }
    [data-theme="dark"] .select2-container .select2-selection--single {
        background-color: var(--nb-surface) !important;
        border-color: var(--nb-border) !important;
        box-shadow: 2px 2px 0 0 var(--nb-border);
    }
    [data-theme="dark"] .select2-container--default .select2-selection--single .select2-selection__rendered { color: var(--nb-ink); }
    [data-theme="dark"] .select2-container--default .select2-selection--single .select2-selection__arrow b { border-color: var(--nb-ink-2) transparent transparent transparent; }
    [data-theme="dark"] .select2-dropdown {
        background-color: var(--nb-surface) !important;
        border-color: var(--nb-border) !important;
        box-shadow: 6px 6px 0 0 var(--nb-border) !important;
    }
    [data-theme="dark"] .select2-search--dropdown {
        background: var(--nb-surface-2);
        border-bottom-color: var(--nb-border-light);
    }
    [data-theme="dark"] .select2-search--dropdown .select2-search__field {
        background-color: var(--nb-surface-2) !important;
        border-color: var(--nb-border-light) !important;
        color: var(--nb-ink) !important;
    }
    [data-theme="dark"] .select2-search--dropdown .select2-search__field:focus {
        border-color: var(--nb-primary) !important;
        box-shadow: 3px 3px 0 0 var(--nb-primary-dark);
    }
    [data-theme="dark"] .select2-results__option {
        background-color: var(--nb-surface) !important;
        color: var(--nb-ink-3);
    }
    [data-theme="dark"] .select2-results__option:hover { background-color: var(--nb-surface-3) !important; color: var(--nb-ink) !important; }
    [data-theme="dark"] .select2-results__option--highlighted[aria-selected] { background: var(--nb-primary) !important; color: var(--nb-on-accent) !important; }
    [data-theme="dark"] .select2-results__option[aria-selected="true"] { background: var(--nb-surface-3) !important; color: var(--nb-ink) !important; }
    [data-theme="dark"] .select2-container--default.select2-container--open .select2-selection--multiple,
    [data-theme="dark"] .select2-container--focus .select2-selection--multiple {
        border-color: var(--nb-primary) !important;
        box-shadow: 3px 3px 0 0 var(--nb-primary-dark);
    }
    [data-theme="dark"] .select2-selection__choice {
        background: var(--nb-primary) !important;
        color: var(--nb-on-accent) !important;
        border-color: var(--nb-border) !important;
        box-shadow: 2px 2px 0 0 var(--nb-border);
    }
    @media (max-width: 768px) {
        .select2-container .select2-selection--single { height: 40px; }
        .select2-container--default .select2-selection--single .select2-selection__rendered { line-height: 36px; font-size: 0.82rem; }
        .select2-option-icon { width: 28px; height: 28px; font-size: 0.9rem; }
    }
</style>
<script>
(function() {
  function initSelect2Icons() {
    if (typeof jQuery === 'undefined' || typeof jQuery.fn === 'undefined' || typeof jQuery.fn.select2 === 'undefined') {
      setTimeout(initSelect2Icons, 100);
      return;
    }
    jQuery('.select2-search').each(function() {
      var $this = jQuery(this);
      if ($this.data('s2-icons')) return;
      $this.data('s2-icons', true);
      var type = $this.data('type') || 'default';
      $this.select2({
        placeholder: function() { return jQuery(this).attr('placeholder') || 'Pilih...'; },
        allowClear: true,
        width: '100%',
        language: {
          searching: function() { return 'Mencari...'; },
          noResults: function() { return 'Tidak ditemukan'; },
          inputTooShort: function() { return 'Masukkan minimal 2 karakter'; }
        },
        minimumInputLength: 0,
        templateResult: function(option) {
          if (!option.id) return option.text;
          if (type === 'klasifikasi' && option.element) {
            var $el = jQuery(option.element);
            var kode = $el.data('kode') || '';
            var nama = $el.data('nama') || option.text;
            return jQuery('<span class="select2-option-with-icon"><span class="select2-option-icon klasifikasi"><i class="bi bi-folder"></i></span><span class="select2-option-content"><span class="select2-option-title">' + nama + '</span><span class="select2-option-subtitle">' + kode + '</span></span></span>');
          }
          if (type === 'lokasi' && option.element) {
            var $el = jQuery(option.element);
            var nama = $el.data('nama') || option.text;
            return jQuery('<span class="select2-option-with-icon"><span class="select2-option-icon lokasi"><i class="bi bi-geo-alt"></i></span><span class="select2-option-content"><span class="select2-option-title">' + nama + '</span></span></span>');
          }
          if (type === 'jenis' && option.element) {
            var $el = jQuery(option.element);
            var kode = $el.data('kode') || '';
            var nama = $el.data('nama') || option.text;
            return jQuery('<span class="select2-option-with-icon"><span class="select2-option-icon jenis"><i class="bi bi-tag"></i></span><span class="select2-option-content"><span class="select2-option-title">' + nama + '</span><span class="select2-option-subtitle">' + kode + '</span></span></span>');
          }
          return option.text;
        },
        templateSelection: function(option) {
          if (!option.id) return option.text;
          if (type === 'klasifikasi' && option.element) {
            var $el = jQuery(option.element);
            var nama = $el.data('nama') || option.text;
            var kode = $el.data('kode') || '';
            return jQuery('<span class="select2-selection-with-icon"><span class="select2-selection-icon klasifikasi"><i class="bi bi-folder"></i></span><span>' + nama + ' (' + kode + ')</span></span>');
          }
          if (type === 'lokasi' && option.element) {
            var $el = jQuery(option.element);
            var nama = $el.data('nama') || option.text;
            return jQuery('<span class="select2-selection-with-icon"><span class="select2-selection-icon lokasi"><i class="bi bi-geo-alt"></i></span><span>' + nama + '</span></span>');
          }
          if (type === 'jenis' && option.element) {
            var $el = jQuery(option.element);
            var nama = $el.data('nama') || option.text;
            var kode = $el.data('kode') || '';
            return jQuery('<span class="select2-selection-with-icon"><span class="select2-selection-icon jenis"><i class="bi bi-tag"></i></span><span>' + nama + ' (' + kode + ')</span></span>');
          }
          return option.text;
        }
      });
    });
  }
  initSelect2Icons();
})();
</script>
{{end}}
