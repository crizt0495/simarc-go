name: Desktop installers

# A Wails app links against the platform webview through cgo, so it cannot be
# cross-compiled: each installer has to be built by a runner of its own OS.
# That is what the matrix below does — one job per platform, one artifact out.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  # ── Fast checks that need no platform webview ──────────────────────────────
  verify:
    name: Verify (web)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: arsippro_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Create .env for the test database
        run: |
          cat > .env <<'EOF'
          APP_PORT=8080
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=arsippro_test
          DB_USERNAME=root
          DB_PASSWORD=testpass
          SESSION_KEY=ci-session-key-for-tests-only-000000000
          APP_DEBUG=false
          EOF

      - name: Build the web binary (what Vercel deploys)
        run: go build -o /tmp/simarc-server ./cmd/server

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Minified CSS is in sync with its source
        # The pages load *.min.css, not the source. A stale artifact ships the
        # previous styles silently, so fail loudly instead.
        run: npm run css:check

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Check the desktop shell contract
        # Needs the webview headers; installed by the Linux desktop job below,
        # so only the test-only build tags are applied here.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          cd desktop && go test -tags "desktop webkit2_41" ./...

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop topbar layout (rendered)
        # The desktop shell serves these same templates and CSS in topbar mode,
        # so a real browser at the Wails window size (1440x900) can verify the
        # computed layout: bar pinned to the top, no sidebar, no clipped group.
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8099
        run: |
          go build -o /tmp/simarc-topbar ./cmd/server
          SIMARC_LAYOUT=topbar PORT=8099 /tmp/simarc-topbar &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/ >/dev/null
          npx playwright test -c playwright.config.js --project=setup
          npx playwright test -c playwright.topbar.config.js

  # ── Linux: .deb, AppImage, tarball ──────────────────────────────────────────
  linux:
    name: Linux installer
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build and webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential pkg-config \
            desktop-file-utils fuse libfuse2

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install appimagetool
        run: |
          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Build the .deb and tarball
        run: ./scripts/package-linux.sh

      - name: Build the AppImage
        working-directory: desktop
        run: |
          set -euo pipefail
          dist=build/dist
          appdir="$dist/AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/512x512/apps"
          cp build/bin/SIMARC "$appdir/usr/bin/SIMARC"
          cp ../.desktop/simarc.desktop "$appdir/simarc.desktop"
          cp build/appicon.png "$appdir/simarc.png"
          cp build/appicon.png \
             "$appdir/usr/share/icons/hicolor/512x512/apps/simarc.png"
          printf '#!/usr/bin/env bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/usr/bin/SIMARC" "$@"\n' \
            > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          appimagetool --no-appstream "$appdir" "$dist/SIMARC-x86_64.AppImage"
          rm -rf "$appdir"

      - name: Verify the AppImage
        run: |
          set -euo pipefail
          appimage=$(ls desktop/build/dist/*.AppImage | head -1)
          "$appimage" --appimage-version >/dev/null
          # Confirm the binary, desktop entry and icon are really embedded and
          # not merely present next to the AppImage.
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/usr/bin/SIMARC
          test -f squashfs-root/simarc.desktop
          test -f squashfs-root/simarc.png
          desktop-file-validate squashfs-root/simarc.desktop
          file squashfs-root/usr/bin/SIMARC | grep -q 'ELF'
          rm -rf squashfs-root

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simarc-linux-amd64
          path: desktop/build/dist/*
          if-no-files-found: error

  # ── macOS: .app bundle and .dmg ────────────────────────────────────────────
  macos:
    name: macOS installer
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build the .app and .dmg
        working-directory: desktop
        run: wails build -tags "desktop" -skipbindings -package -platform darwin/universal

      - name: Verify the bundle
        working-directory: desktop
        run: |
          set -euo pipefail
          test -d build/bin/SIMARC.app
          test -f build/bin/SIMARC.app/Contents/MacOS/SIMARC
          # The icon must be a real .icns, not a placeholder.
          file build/bin/SIMARC.app/Contents/Resources/icon.icns | grep -qi 'icns'
          # And the bundle must declare a plist.
          plutil -lint build/bin/SIMARC.app/Contents/Info.plist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simarc-macos-universal
          path: |
            desktop/build/bin/SIMARC.app
            desktop/build/bin/SIMARC.dmg
          if-no-files-found: error

  # ── Windows: .exe and NSIS installer ────────────────────────────────────────
  windows:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build the NSIS installer
        working-directory: desktop
        run: wails build -tags "desktop" -skipbindings -nsis -platform windows/amd64

      - name: Verify the installer
        working-directory: desktop
        run: |
          $exe = Get-ChildItem -Path build/bin -Filter '*.exe' -Recurse |
                 Where-Object { $_.Name -notlike '*setup*' } | Select-Object -First 1
          if (-not $exe) { throw 'SIMARC.exe was not produced' }
          Write-Host "found $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
          # A PE binary, not a Go archive: this is the mistake that made an
          # earlier Linux build produce '!<arch>' instead of an executable.
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'SIMARC.exe is not a Windows executable (missing MZ header)'
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simarc-windows-amd64
          path: |
            desktop/build/bin/**/*.exe
          if-no-files-found: error

  # ── Release, only for tags ─────────────────────────────────────────────────
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List the artifacts
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
